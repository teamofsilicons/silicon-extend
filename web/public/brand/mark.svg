<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="#181818" role="img" aria-label="Extend">
  <!--
    Silicon Extend. Built on Interface's grid: 1 part = 1/35 of Interface's field, unit square 9,
    gutter 4, one square turned 45 degrees (half-diagonal 9.71). The field is 44: Interface's 35
    plus one unit.
    Subpaths, in order (all clockwise, so the overlaps union into one shape):
      the ring, one unit down: W, NW, N, E, SE, S, SW (its north-east corner square has left);
      the turned square at the ring's centre (17.5, 26.5);
      the reach: the NE square, stepped one gutter out along the diagonal (the row of N, the column of E);
      the device: a ninth square, touching the reach corner to corner, one unit further out.
  -->
  <path d="M0 22h9v9h-9zM4 13h9v9h-9zM13 9h9v9h-9zM26 22h9v9h-9zM22 31h9v9h-9zM13 35h9v9h-9zM4 31h9v9h-9zM17.5 16.79L27.21 26.5L17.5 36.21L7.79 26.5zM26 9h9v9h-9zM35 0h9v9h-9z"/>
</svg>
