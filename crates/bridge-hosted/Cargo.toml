[package]
name = "bridge-hosted"
description = "Drivers for devices a computer carries: iPhone, iPad, Apple TV, Samsung and LG TVs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
bridge-driver.workspace = true
bridge-protocol.workspace = true
async-trait.workspace = true
base64 = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.41"
uuid = { version = "1.26.0", features = ["v4"] }
rand = "0.9"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# WebSockets for the Samsung and LG remote-control sockets. TLS is done by `tls.rs` (native-tls), so
# tungstenite only needs the handshake; this keeps ring/aws-lc (C code) out of Windows cross builds.
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }
native-tls = "0.2.18"
tokio-native-tls = "0.3.1"
# mDNS for Apple TV discovery (and Samsung TVs that announce themselves).
mdns-sd = "0.13.11"
# Apple TV: HAP pairing (SRP-6a, Ed25519, X25519, ChaCha20-Poly1305, HKDF-SHA512) and AirPlay plists.
num-bigint = "0.4.6"
sha2 = "0.10.9"
hkdf = "0.12.4"
ed25519-dalek = "2.2.0"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
chacha20poly1305 = "0.10.1"
plist = "1.8.0"
hex = "0.4.3"
url = "2.5.7"

[dev-dependencies]
sha1 = "0.10.6"
tempfile = "3.20.0"
