[package]
name = "extend-service"
description = "The Silicon Extend service"
version = "4.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "extend_service"
path = "src/lib.rs"

[[bin]]
name = "extend-service"
path = "src/main.rs"

[dependencies]
extend-protocol.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
hex.workspace = true
hmac.workspace = true
http.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
space-station = "0.1.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
silicon-accounts-client.workspace = true
# The local Silicon Accounts stand-in (development and tests, refused in production) signs its
# access tokens the way Silicon Accounts does: EdDSA (Ed25519) JWTs. Both crates are already in the
# graph through silicon-accounts-client.
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
ed25519-dalek = { version = "2.2.0", features = ["pkcs8", "rand_core"] }
aes-gcm = "0.10.3"

[dev-dependencies]
silicon-extend-client.workspace = true
tokio-tungstenite.workspace = true
reqwest.workspace = true
