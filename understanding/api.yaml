# Contract file. Agents: propose changes to a Carbon and get approval before editing.
# Draft for Carbon review, 2026-09-26. Product intent: UNDERSTANDING.md. Identifier formats and flows: TECHNICAL.md.
# Brought up to date with the build after round 2 of fixes (2026-09-27): every route and field below is what the
# service answers today. The additions of that round await a Carbon's review like the rest of the file.
# 1.1.0 draft (2026-09-27), for the Carbon's approval: devices belong to the Carbons who paired them, several Carbons can
# pair one device, waking a device, setup retry, and the device engine named Silicon Extend. It follows UNDERSTANDING.md
# as the Carbon edited it on 2026-09-27 and the Carbon's decisions of that day (logout, requests routed to a Carbon,
# the terminal on shared computers, visible Ting setup guidance). API v1 stays additive: no path, method, required field or
# error code changed, and a 1.0 client ignores every new field.
# Wire names `org_id` and `X-Org-ID` are Silicon IAM's names for a Team handle and are kept as IAM defines them.

# Review copy reconciled with the 1.1 implementation on 2026-09-28; originals are unchanged.
# Includes shared banner controls, stored display media, TV element clicks and verified Ting type semantics.

openapi: 3.1.0
info:
  title: Silicon Extend API
  version: 1.1.0-draft
  description: |
    Silicon Extend lets a Silicon use a Carbon's personal devices. This API is used by the `extend` CLI
    (through the `silicon-extend-client` crate), the configuration website, and the Extend apps on devices.

    Conventions
    - Every JSON body is an envelope: `{"type": "<kind>", "data": {...}}`.
    - Errors: `{"type": "error", "data": {"code", "message", "hint", "docs_url", "request_id", "details"}}`.
      `code` is stable and machine-readable; `message` says what happened and why; `hint` says what to do next.
    - Timestamps are RFC 3339 UTC with milliseconds. Durations carry their unit in the field name.
    - Every response carries `X-Request-ID` and `Silicon-Extend-API-Version`.
    - Lists are paged with `limit` and `cursor`; the response gives `next_cursor`, null on the last page. A page that
      has a `next_cursor` is always full; only the last page can be short.
    - Retry a POST after an uncertain result with the same `Idempotency-Key` and the identical body. The same key with
      a different body is `409 conflict`.
    - API majors (TECHNICAL.md section 10). Every `/api/v{n}/` request is checked before anything else: a major this
      service doesn't serve is `400 api_version_unsupported`; a `Silicon-Extend-API-Version` pin naming another major
      than the path is `400 api_version_mismatch`; a sunset major is `410 api_version_sunset`, whose hint says how to
      update and whose `details` carry `{api_version, sunset_at, supported}`. Every response on a deprecated major
      carries `Deprecation: @<unix seconds>` (RFC 9745, when it was deprecated) and `Sunset: <HTTP-date>` (RFC 8594,
      the soonest it can be sunset: 7 consecutive days with zero requests after the later of its deprecation and its
      last request).
    - Test environments: send the test application's `app_secret` in `X-Testing-Application-Secret`. Omit it for
      production. The header is checked on every `/api/v{n}/` route, including the ones that sign nobody in
      (enrollments, `/api/v1/iam`, `/api/v1/contracts`, reports, telemetry). A header that is empty, blank, sent more
      than once, not printable, unknown or revoked, or that belongs to a disabled or permanently removed environment,
      is `401 testing_secret_invalid`. An environment Honeycomb is still preparing (or restoring), one being cleaned,
      and one IAM knows but Extend was never prepared for, is `503 testing_environment_not_ready`. Neither ever falls
      back to production. `GET /api/version`, `/live`, `/ready`, `/webhook/` and `/internal/…` take no secret.
    - Browsers: CORS mirrors the request's origin, methods and headers, and exposes `ETag`, `X-Request-ID`,
      `Silicon-Extend-API-Version`, `Content-Disposition`, `Content-Range`, `Deprecation` and `Sunset`.

    Devices, Carbons and Teams (1.1)
    - A device belongs to the Carbon who paired it, not to a Team. Several Carbons can pair one device (a family TV);
      each has their own pair of it, with its own `device_id`, name, access list, lifetime and activity log. Ending one
      pair never touches the others.
    - `X-Org-ID` is a Silicon's Team for everything it does: its access grants, sessions, files, requests and wake
      requests belong to that Team. A Carbon may leave it out on the routes for their own devices; when sent it must be
      a Team their login reaches, and it no longer filters devices, grants or history (a Carbon sees all of it, each
      item tagged with its Team). It stays the default Team for new grants.
    - Some things go through IAM, Briefcase or Ting on the Carbon's behalf in a Team: listing that Team's Silicons,
      granting to them, opening their files, getting Tings there. They need the Carbon's Extend login to reach that
      Team; otherwise the answer is `403 not_a_team_member`, "Sign in to Extend for <team> …".
    - One Silicon uses a physical device at a time, across every pair and Team. A Carbon sees only their own side (their
      own pair and its Silicons): another side's Silicon shows as "in use" (`in_use_by_other`), never named.
    - Extend acts on Team membership only when IAM answers definitely (TECHNICAL.md section 9).
    - Every command Extend writes for a Silicon (a message, hint or Ting) starts with `extend --team <team>`.
    - The wake hint: when a device is known not to be awake (or was not awake when last seen), `device_offline`,
      `unsupported_on_device` and a failed command's answer add "<name> isn't awake (<state> since <time>). Its Carbon can
      wake it: extend --team <team> device wake <id> --reason \"...\"". Awake never refuses anything by itself.
servers:
  - url: https://backend.extend.teamofsilicons.com
security:
  - bearerAuth: []
tags:
  - {name: System, description: 'Health, version negotiation and contract discovery'}
  - {name: Auth, description: Sign in with a short-lived token from Silicon IAM}
  - {name: Enrollment, description: An unpaired Extend app getting and rotating its pairing code}
  - {name: Pairing, description: 'A Carbon claiming a pairing code, and devices paired through a host computer'}
  - {name: Devices, description: 'Listing, inspecting and configuring paired devices'}
  - {name: Access, description: Which Silicons can use a device}
  - {name: Sessions, description: 'A Silicon using a device, one Silicon at a time'}
  - {name: Commands, description: 'Device engine commands and Extend additions, run inside a session'}
  - {name: Requests, description: 'A Silicon asking for a device in use, delivered through Ting to the Silicon using it or to the Carbon who gave that Silicon access'}
  - {name: Waking, description: 'A Silicon asking its Carbon to wake a device, and the Carbon answering (1.1)'}
  - {name: Ting, description: 'Recipient registration per Team, and missing app/context notification types observed on delivery (1.1)'}
  - {name: Activity, description: Every action taken on a device}
  - {name: Files, description: 'Screenshots, recordings, logs and replay scripts, stored in Briefcase'}
  - {name: Device app, description: 'Endpoints used only by a paired Extend app, with its device credential'}
  - {name: Testing, description: 'The selected test environment, and Honeycomb lifecycle instructions'}
  - {name: IAM webhooks, description: Signed Silicon IAM callbacks}
  - {name: Operations, description: Bug reports and telemetry}

paths:
  # ───────────────────────────── System ─────────────────────────────
  /live:
    get:
      tags: [System]
      operationId: live
      summary: The process is running
      security: []
      responses:
        '204': {description: Alive}
  /ready:
    get:
      tags: [System]
      operationId: ready
      summary: Database, migrations and IAM reachable
      security: []
      responses:
        '204': {description: Ready}
        '503': {description: A dependency is unavailable; the body names it}
  /api/version:
    get:
      tags: [System]
      operationId: negotiateVersion
      summary: Agree an API major version
      description: |
        Unversioned so an old client can always reach it. The client lists every major it supports; the
        service answers with the highest both support that is not sunset. The client then pins that version on every
        request with `Silicon-Extend-API-Version`. No common version is `400 api_version_unsupported` listing both sides.
        A client that speaks only majors Extend has retired gets `410 api_version_sunset`, saying when and why and what
        to update. When the agreed major is deprecated, the answer carries `Deprecation` and `Sunset` headers.
      security: []
      parameters:
        - name: Silicon-Extend-Supported-API-Versions
          in: header
          required: false
          description: Every major the client supports. A client too old to send it is taken to support 1.
          schema: {type: string, pattern: '^[1-9][0-9]*(, ?[1-9][0-9]*)*$'}
          example: '1, 2'
      responses:
        '200':
          description: Agreed version
          headers:
            Silicon-Extend-API-Version: {schema: {type: string}, description: The agreed major}
            Vary: {schema: {type: string, const: Silicon-Extend-Supported-API-Versions}}
            Deprecation: {$ref: '#/components/headers/Deprecation'}
            Sunset: {$ref: '#/components/headers/Sunset'}
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: version}
                  data:
                    type: object
                    required: [api_version, supported, service_version]
                    properties:
                      api_version: {type: integer, example: 1}
                      supported: {type: array, items: {type: integer}, example: [1], description: Majors a client can agree on (served and not sunset)}
                      service_version: {type: string, example: 1.0.0}
                      deprecated: {type: array, items: {type: integer}, description: The supported majors that are deprecated}
        '400': {$ref: '#/components/responses/Error'}
        '410': {description: 'api_version_sunset: every major the client speaks is retired', $ref: '#/components/responses/Error'}
  /api/v1/contracts:
    get:
      tags: [System]
      operationId: contracts
      summary: Compatibility matrix and deprecation state
      description: |
        Built from live state, not a fixed list. Each major's lifecycle (`current` → `deprecated` → `sunset`) is kept in
        `extend_global.api_versions`, shared by every instance: configuration deprecates a major
        (`EXTEND_DEPRECATED_API_VERSIONS`, applied when an instance starts; the newest served major can't be
        deprecated), and a deprecated major is sunset automatically after 7 consecutive days with zero requests
        (requests are counted per major and UTC day; an instance re-checks every 5 minutes). Sunset is final. The client
        crate and CLI ranges come from `EXTEND_API_V{n}_CLIENT_CRATE` and `EXTEND_API_V{n}_CLI` (default
        `>={n}.0.0, <{n+1}.0.0`), and `device_app_min` from `EXTEND_DEVICE_APP_MIN_VERSION`. Retired majors stay listed
        after their routes are gone. A request to this route counts as a request today for the major it came in on.
        `extend version` reads this to say whether the CLI is current, deprecated or sunset.
      security: []
      parameters:
        - {$ref: '#/components/parameters/TestingSecret'}
      responses:
        '200':
          description: Every API major, its state, and the client, CLI and app versions that work with it
          headers:
            Deprecation: {$ref: '#/components/headers/Deprecation'}
            Sunset: {$ref: '#/components/headers/Sunset'}
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: contracts}
                  data:
                    type: object
                    required: [service_version, current, supported, deprecated, sunset_rule, versions]
                    properties:
                      service_version: {type: string, example: 1.0.0}
                      current: {type: integer, example: 1, description: The newest major a client can agree on}
                      supported: {type: array, items: {type: integer}, example: [1], description: Majors served and not sunset}
                      deprecated: {type: array, items: {type: integer}, example: []}
                      sunset_rule: {type: string, example: 'Sunset after 7 consecutive days with zero requests'}
                      versions:
                        type: array
                        description: Every major with a lifecycle record, oldest first, including retired ones
                        items:
                          type: object
                          required: [api_version, state, deprecated_at, sunset_at, sunset_earliest_at, last_request_on, sunset_rule, compatible]
                          properties:
                            api_version: {type: integer}
                            state: {type: string, enum: [current, deprecated, sunset]}
                            deprecated_at: {type: [string, 'null'], format: date-time}
                            sunset_at: {type: [string, 'null'], format: date-time, description: When the sunset rule was met}
                            sunset_earliest_at:
                              type: [string, 'null']
                              format: date-time
                              description: 'Deprecated majors only: the soonest it can be sunset if no request arrives (the Sunset header)'
                            last_request_on: {type: [string, 'null'], format: date, description: The last UTC day with a request}
                            sunset_rule: {type: string, example: 'Sunset after 7 consecutive days with zero requests'}
                            compatible:
                              type: object
                              required: [client_crate, cli, device_app_min]
                              properties:
                                client_crate: {type: string, example: '>=1.0.0, <2.0.0'}
                                cli: {type: string, example: '>=1.0.0, <2.0.0'}
                                device_app_min: {type: string, example: 1.0.0}
              example:
                type: contracts
                data:
                  service_version: 1.0.0
                  current: 1
                  supported: [1]
                  deprecated: []
                  sunset_rule: Sunset after 7 consecutive days with zero requests
                  versions:
                    - api_version: 1
                      state: current
                      deprecated_at: null
                      sunset_at: null
                      sunset_earliest_at: null
                      last_request_on: '2026-09-27'
                      sunset_rule: Sunset after 7 consecutive days with zero requests
                      compatible: {client_crate: '>=1.0.0, <2.0.0', cli: '>=1.0.0, <2.0.0', device_app_min: 1.0.0}
        '401': {description: testing_secret_invalid, $ref: '#/components/responses/Error'}
        '410': {description: 'api_version_sunset: the path''s major is retired', $ref: '#/components/responses/Error'}
        '503': {description: testing_environment_not_ready, $ref: '#/components/responses/Error'}
  /api/v1/iam:
    get:
      tags: [System]
      operationId: iamInformation
      summary: Public IAM application details (what `extend iam --json` prints)
      security: []
      description: Available before login. Never returns a secret.
      parameters:
        - {$ref: '#/components/parameters/TestingSecret'}
      responses:
        '200':
          description: Public configuration
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: iam}
                  data:
                    type: object
                    required: [app_id, iam_base_url, api_base_url, website_url, docs_url]
                    properties:
                      app_id: {type: string, example: extend}
                      iam_base_url: {type: string, format: uri, example: 'https://backend.iam.teamofsilicons.com'}
                      iam_login_url:
                        type: [string, 'null']
                        format: uri
                        example: 'https://auth.iam.teamofsilicons.com/login'
                        description: 'Send a Carbon here to sign in: {iam_login_url}?app_id=<app_id>&redirect_uri=<url>. IAM appends slt=<token> to redirect_uri.'
                      api_base_url: {type: string, format: uri, example: 'https://backend.extend.teamofsilicons.com'}
                      website_url: {type: string, format: uri, example: 'https://extend.teamofsilicons.com'}
                      docs_url: {type: string, format: uri}
                      repository_url: {type: string, format: uri}
                      testing_environment: {oneOf: [{$ref: '#/components/schemas/TestingEnvironment'}, {type: 'null'}]}
        '401': {description: testing_secret_invalid, $ref: '#/components/responses/Error'}
        '503': {description: testing_environment_not_ready, $ref: '#/components/responses/Error'}

  # ───────────────────────────── Auth ─────────────────────────────
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Exchange a Silicon IAM short-lived token for an Extend session
      description: |
        The CLI and client never ask for a password. They take the short-lived token (SLT) a member generates
        with the IAM CLI or the IAM consent screen. In a test environment `slt` may instead be an existing test
        member id (`c:alice`, `si:chef`); that form is refused in production. Body at most 16 KiB. Responses are
        `Cache-Control: no-store`.
      security: []
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/TestingSecret'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: {const: login}
                data:
                  type: object
                  additionalProperties: false
                  required: [slt]
                  properties:
                    slt: {type: string, writeOnly: true, minLength: 1, maxLength: 4096, description: Opaque. Never infer anything from its prefix.}
            example: {type: login, data: {slt: 'oac_…'}}
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: login}
                  data: {$ref: '#/components/schemas/AuthSession'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: Rotate the refresh token
      description: One refresh at a time per token. Store the returned pair atomically; a reused refresh token revokes the family.
      security: []
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/TestingSecret'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: {const: refresh}
                data:
                  type: object
                  additionalProperties: false
                  required: [refresh_token]
                  properties:
                    refresh_token: {type: string, writeOnly: true, pattern: '^ort_'}
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: refresh}
                  data: {$ref: '#/components/schemas/AuthSession'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out
      description: |
        `token` is the login to revoke: the refresh token (revokes the whole family) or an access token. Signing out
        ends access at once (UNDERSTANDING.md, Access), so Extend first asks IAM whose login `token` is (introspection;
        a refresh token works on its own, with no Authorization header), falling back to the access token in
        `Authorization` when one is sent:
        - A Silicon signing out ends its own running sessions in this world (`silicon_logged_out`).
        - A Carbon signing out (the website or `extend logout`) ends the running sessions of the Silicons that Carbon
          gave access to: every session through that Carbon's pairs, in every Team, as `access_removed` (1.1, the
          Carbon's decision of 2026-09-27). Only that Carbon's side ends; a Silicon another Carbon gave access to keeps
          its session on the same device. Nothing else changes: the devices stay paired and the grants stay.
        If IAM can't be asked, nothing is revoked or ended and the error says so (with IAM's own code, usually
        `503 service_unavailable`); retry. An empty `token` is `422 invalid_input`.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/TestingSecret'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: {const: logout}
                data:
                  type: object
                  additionalProperties: false
                  required: [token]
                  properties:
                    token: {type: string, writeOnly: true, minLength: 1, description: 'The refresh token (ort_…) or an access token (oat_…)'}
      responses:
        '204': {description: Signed out}
        '401': {$ref: '#/components/responses/Error'}
        '422': {description: 'invalid_input: empty token', $ref: '#/components/responses/Error'}
        '503': {description: 'IAM could not be asked whose login it is; nothing was revoked', $ref: '#/components/responses/Error'}
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: me
      summary: Who is signed in (what `extend login status --json` prints)
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderOptional'}
        - {$ref: '#/components/parameters/TestingSecret'}
      responses:
        '200':
          description: Live identity, checked with IAM
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: me}
                  data:
                    type: object
                    required: [authenticated, member, teams]
                    properties:
                      authenticated: {type: boolean, const: true}
                      member: {$ref: '#/components/schemas/Member'}
                      teams: {type: array, items: {type: string}, example: [acme]}
                      team: {type: [string, 'null'], description: 'The team named by X-Org-ID, if sent'}
                      team_role: {type: [string, 'null'], description: Null when IAM does not disclose it}
                      testing_environment: {oneOf: [{$ref: '#/components/schemas/TestingEnvironment'}, {type: 'null'}]}
        '401': {$ref: '#/components/responses/Error'}

  # ───────────────────────────── Enrollment (unpaired app) ─────────────────────────────
  /api/v1/enrollments:
    post:
      tags: [Enrollment]
      operationId: createEnrollment
      summary: An unpaired Extend app asks for a pairing code
      description: |
        No login. At most 60 new enrollments per hour per client address (`429 rate_limited` with
        `details.retry_after_s`; behind a proxy listed in `EXTEND_TRUSTED_PROXY_CIDRS` the address is read from
        `X-Forwarded-For`). The app keeps `enrollment_secret` in memory or its secret store and shows `pairing_code`.
        The code rotates every 300 s; the app follows rotations on the enrollment WebSocket or by polling
        `GET /api/v1/enrollments/{enrollment_id}`.

        The enrollment is bound to the world the request selects: an app started with a test environment's
        `X-Testing-Application-Secret` gets a code that pairs it only into that environment, and one started without
        gets a production code (see `POST /api/v1/pairings`). A clean or permanent removal of the environment deletes
        its waiting enrollments.
      security: []
      parameters:
        - {$ref: '#/components/parameters/TestingSecret'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: {const: enrollment}
                data:
                  type: object
                  additionalProperties: false
                  required: [os, app_version]
                  properties:
                    os: {$ref: '#/components/schemas/DeviceOs'}
                    os_version: {type: string, maxLength: 64, example: '15'}
                    model: {type: string, maxLength: 128, example: Pixel 9}
                    app_version: {type: string, maxLength: 32, example: 1.1.0}
                    engine_version: {type: string, maxLength: 32, description: 'The device engine''s version on a computer (1.1). 1.0 apps send it as agent_device_version, which is still read.'}
                    agent_device_version: {type: string, maxLength: 32, deprecated: true, description: 'The 1.0 name of engine_version'}
      responses:
        '201':
          description: Enrollment with its first code
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: enrollment}
                  data:
                    type: object
                    required: [enrollment_id, enrollment_secret, pairing_code, code_expires_at, rotates_every_s]
                    properties:
                      enrollment_id: {type: string, format: uuid}
                      enrollment_secret: {type: string, pattern: '^ees_[A-Za-z0-9_-]{43}$', description: Returned once}
                      pairing_code: {$ref: '#/components/schemas/PairingCode'}
                      code_expires_at: {type: string, format: date-time}
                      rotates_every_s: {type: integer, const: 300}
              example:
                type: enrollment
                data:
                  enrollment_id: 01926f3a-5c1e-7b2d-9a40-3e5f8c7d1b22
                  enrollment_secret: ees_Q2hhbmdlLW1lLXRoaXMtaXMtYS1zYW1wbGUtc2VjcmV
                  pairing_code: 4F9C2A
                  code_expires_at: '2026-09-26T10:05:00.000Z'
                  rotates_every_s: 300
        '401': {description: testing_secret_invalid, $ref: '#/components/responses/Error'}
        '422': {description: 'invalid_input, for example an OS that pairs through a host (ios, tvos, samsung_tv…)', $ref: '#/components/responses/Error'}
        '426': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {description: testing_environment_not_ready, $ref: '#/components/responses/Error'}
  /api/v1/enrollments/{enrollment_id}:
    parameters:
      - {$ref: '#/components/parameters/EnrollmentId'}
      - {$ref: '#/components/parameters/TestingSecret'}
    get:
      tags: [Enrollment]
      operationId: getEnrollment
      summary: Current code, or the device credential once paired
      description: |
        `state: waiting` returns the live code. `state: paired` returns `device_id` and `device_credential`
        exactly once; the enrollment is then gone and later reads are 404. When `X-Testing-Application-Secret` is sent
        here (and on `DELETE` and `/connect`), it must select the world the enrollment was started in; another world is
        `401 testing_secret_invalid`. Sending none is always accepted.
      security:
        - enrollmentSecret: []
      responses:
        '200':
          description: Enrollment state
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: enrollment}
                  data: {$ref: '#/components/schemas/EnrollmentState'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Enrollment]
      operationId: discardEnrollment
      summary: The app stops waiting to be paired
      security:
        - enrollmentSecret: []
      responses:
        '204': {description: Discarded; its code no longer works}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/enrollments/{enrollment_id}/connect:
    parameters:
      - {$ref: '#/components/parameters/EnrollmentId'}
    get:
      tags: [Enrollment]
      operationId: enrollmentSocket
      summary: WebSocket that pushes code rotations and the pairing result
      description: |
        Upgrade to WebSocket. Frames are JSON `{"type", "data"}`:
        `code` `{pairing_code, code_expires_at}` every 300 s; `paired` `{device_id, device_credential, environment}`
        once, then the server closes with 1000. Heartbeat as on the device socket.
      security:
        - enrollmentSecret: []
      responses:
        '101': {description: Switching protocols}
        '401': {$ref: '#/components/responses/Error'}

  # ───────────────────────────── Pairing (Carbon) ─────────────────────────────
  /api/v1/pairings:
    post:
      tags: [Pairing]
      operationId: claimPairingCode
      summary: A Carbon enters a device's pairing code
      description: |
        Carbons only. Creates the Carbon's pair of the device in the selected world (production, or the test
        environment named by X-Testing-Application-Secret), owned by the caller. The code works once. A wrong code never
        reveals whether it existed. Rate-limited to 5 failures per Carbon per 10 minutes.

        1.1: X-Org-ID is optional. The device belongs to the Carbon, not to a Team; the pair only records the Team that
        was selected (X-Org-ID, else the first of the Carbon's Teams) as `DeviceSelf.team`, which authorizes nothing.
        `silicon_ids` keeps 1.0's meaning (grants in X-Org-ID), so it needs X-Org-ID: `422 invalid_input` without it. The
        1.1 website grants after the claim instead, per Team. `visibility` is accepted and ignored: every device is
        personal. The Carbon is registered with Ting in that Team when Extend hasn't registered them there yet.

        A code from "Pair with another Carbon" (`POST /api/v1/device/enrollments`) adds the caller's pair to a device
        other Carbons already paired: it has its own `device_id`, name, access list and lifetime, and it is ready at once
        (its capabilities and setup come from the other pairs). Every other pair's activity log gets
        `another_carbon_paired` (naming no one), and the answer has `paired_by_others: true`. A Carbon who already has a
        pair of that device gets `409 conflict`: "You already paired this device: it's <your name for it> (<id>) in
        your devices." (the code stays valid for someone else). If every other pair ended meanwhile, it pairs as a new
        device.

        A code pairs only into the world its enrollment was started in. A signed-in Carbon of a team who enters a live
        code from another world gets `404 pairing_code_invalid` naming the direction (a test code into production, a
        production code into a test environment, or another test environment's code) with a hint; those answers are
        limited to 20 per Carbon per 15 minutes. Anyone else (not signed in, a refused token, a Silicon, no team) gets
        the same answer a code that doesn't exist gets. The database backs the rule with a constraint.

        In a test environment with 5 devices already paired, answers 409 `test_device_limit` with the message
        `In test environment you are limited to 5 paired devices per environment.` The limit counts physical devices:
        another Carbon's pair of a device already there never counts. The count and the insert happen
        under one lock per environment, so concurrent claims never exceed 5. Adds to one test environment take turns;
        one that waits more than 10 s for its turn in the service (or 5 s on the database lock) is refused with
        `429 rate_limited` ("This test environment is busy adding other devices…", `details.retry_after_s: 2`). A
        claim whose device was committed always answers 201.
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderOptional'}
        - {$ref: '#/components/parameters/TestingSecret'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: {const: pairing}
                data:
                  type: object
                  additionalProperties: false
                  required: [pairing_code, name]
                  properties:
                    pairing_code: {$ref: '#/components/schemas/PairingCodeInput'}
                    name: {$ref: '#/components/schemas/DeviceName'}
                    visibility: {$ref: '#/components/schemas/Visibility'}
                    pair_ttl_days: {$ref: '#/components/schemas/PairTtlDays'}
                    silicon_ids:
                      type: array
                      maxItems: 100
                      uniqueItems: true
                      items: {$ref: '#/components/schemas/SiliconId'}
                      description: Optional; give access now. Can be skipped and done later.
            example: {type: pairing, data: {pairing_code: 4f9c2a, name: Saket's Pixel, silicon_ids: ['si:chef']}}
      responses:
        '201':
          description: Paired. The device is in `setup` until its own setup steps finish.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: device}
                  data: {$ref: '#/components/schemas/Device'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {description: 'pairing_code_invalid: wrong, expired or used, or made in another world (named for a signed-in Carbon)', $ref: '#/components/responses/Error'}
        '409': {description: 'test_device_limit; conflict (1.1: you already paired this device, named by your own id for it)', $ref: '#/components/responses/Error'}
        '422': {description: 'invalid_input, for example silicon_ids without X-Org-ID', $ref: '#/components/responses/Error'}
        '429': {description: 'rate_limited: too many wrong codes, or the test environment is busy adding other devices', $ref: '#/components/responses/Error'}
  /api/v1/devices/{device_id}/attachments:
    parameters:
      - {$ref: '#/components/parameters/DeviceId'}
    post:
      tags: [Pairing]
      operationId: attachDevice
      summary: Pair an iPhone, iPad, Apple TV or smart TV through a paired computer
      description: |
        `device_id` is the host: a paired Mac (for iPhone, iPad and Apple TV) or any paired computer (for Samsung and
        LG TVs), owned by the caller and online. Creates the new device in `setup` with `host_device_id` set; the
        host receives an `attach` frame, walks the setup and reports the device with `attached`. Counts toward the test
        environment limit, under the same per-environment turn as `POST /api/v1/pairings` (so `429 rate_limited` when
        the environment is busy adding other devices). Refused with `422 invalid_input` and a hint: an OS that runs the
        Extend app itself, the wrong host OS for it, and a host that is itself paired through a computer; an offline
        host is `503 device_offline`; a removed or unknown host is `404 device_not_found`.

        1.1: the host is the caller's own pair of the computer; X-Org-ID is not needed, and `visibility` is ignored. The
        new device is the caller's own pair of it. When the host reports it (`attached` with `hardware_key`), Extend
        recognises the same physical device another Carbon added through another pair of the same computer and links
        the two pairs, so one Silicon at a time holds across them. The same device added twice by one Carbon, or
        carried by another computer, reads not ready with a failing setup step (`duplicate_device`) that says what to do
        and names no other Carbon or computer. In a test environment at its device limit, a device that another
        Carbon's pair of the same computer already carries is accepted provisionally (setup step `recognising`,
        "Waiting for <host> to recognise this device") and counts nothing once linked; if it isn't linked within
        `EXTEND_TEST_LINK_WINDOW_S` (120 s) it is removed with the test device limit message.
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderOptional'}
        - {$ref: '#/components/parameters/TestingSecret'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: {const: attachment}
                data:
                  type: object
                  additionalProperties: false
                  required: [os, name]
                  properties:
                    os: {type: string, enum: [ios, ipados, tvos, samsung_tv, lg_tv]}
                    name: {$ref: '#/components/schemas/DeviceName'}
                    visibility: {$ref: '#/components/schemas/Visibility'}
                    pair_ttl_days: {$ref: '#/components/schemas/PairTtlDays'}
      responses:
        '201':
          description: Attached device, in setup
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: device}
                  data: {$ref: '#/components/schemas/Device'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: test_device_limit, $ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {description: 'rate_limited: the test environment is busy adding other devices', $ref: '#/components/responses/Error'}
        '503': {description: device_offline (the host), $ref: '#/components/responses/Error'}
  /api/v1/devices/{device_id}/setup:
    parameters:
      - {$ref: '#/components/parameters/DeviceId'}
    get:
      tags: [Pairing]
      operationId: getSetup
      summary: The device's setup steps and where each one stands
      description: |
        Owner only (the Carbon who paired this pair; X-Org-ID is optional). Also answers for a removed device the caller
        paired (read-only). A failed step's `error` is one or two sentences for the Carbon, saying what is wrong and what
        to do; `POST .../setup/retry` runs it again.
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderOptional'}
        - {$ref: '#/components/parameters/TestingSecret'}
      responses:
        '200':
          description: Setup state
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: setup}
                  data: {$ref: '#/components/schemas/Setup'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/devices/{device_id}/setup/code:
    parameters:
      - {$ref: '#/components/parameters/DeviceId'}
    post:
      tags: [Pairing]
      operationId: enterSetupCode
      summary: Enter the code an Apple TV shows during setup
      description: |
        Owner only. The code is relayed to the Mac that carries the Apple TV. Checked in this order, each refusal with a
        hint: the caller owns the device (a removed one is `404 device_not_found`); it is paired through a computer (a
        device that runs the Extend app takes no code: `422 invalid_input`); it is an Apple TV (another carried device
        takes no code: `422`); the code is 4 digits after trimming (`422`, echoing what was sent); the host is online
        (`503 device_offline`, "The computer … pairs through is offline, so the code could not reach it.").
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderOptional'}
        - {$ref: '#/components/parameters/TestingSecret'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: {const: setup_code}
                data:
                  type: object
                  additionalProperties: false
                  required: [code]
                  properties:
                    code: {type: string, pattern: '^[0-9]{4}$', example: '4821'}
      responses:
        '200':
          description: Accepted; setup continues
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: setup}
                  data: {$ref: '#/components/schemas/Setup'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {description: device_offline (the host), $ref: '#/components/responses/Error'}
  /api/v1/devices/{device_id}/setup/retry:
    parameters:
      - {$ref: '#/components/parameters/DeviceId'}
    post:
      tags: [Pairing]
      operationId: retrySetup
      summary: Run a failed setup step again (`extend device setup <id> --retry`, the website's Retry) (1.1)
      description: |
        Carbons only: a Carbon who paired the device (the owner of this pair); a Silicon gets `403 carbon_only`, another
        Carbon `404 device_not_found`. Body `{"step": "<key>"}` retries that step; `{}` or no body retries every failed
        step. The service sends the device `setup_retry` (for a device a computer carries, to that computer with
        `target`) and answers 202 with the keys it asked for. It changes no step itself: the device reports progress as
        usual, and `GET .../setup` (or `extend device setup --watch`) follows it.

        Refusals, each with a hint:
        - `400 invalid_input`: the device has no step with that key; the message lists its steps.
        - `409 conflict`: "Nothing to retry: no setup step has failed." (or the named step hasn't failed).
        - `409 device_offline`: "<name> is offline. Setup carries on when it reconnects." For a carried device, when
          the computer it pairs through is offline.
        - `426 upgrade_required`: "<name> runs Silicon Extend <version>, which can't retry from here. Update it to 1.1,
          or tap Retry on the device." The app (or, for a carried device, its computer's app) didn't list
          `setup_retry` in its hello `features`.
        - `429 rate_limited`: at most one retry per device every 5 s; `details.retry_after_s` says when.
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderOptional'}
        - {$ref: '#/components/parameters/TestingSecret'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SetupRetryInput'
                - type: object
                  required: [type, data]
                  properties:
                    type: {const: setup_retry}
                    data: {$ref: '#/components/schemas/SetupRetryInput'}
            examples:
              oneStep: {value: {step: wireless_debugging}}
              everyFailedStep: {value: {}}
      responses:
        '202':
          description: The device was asked to run these steps again
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: setup_retry}
                  data: {$ref: '#/components/schemas/RetryResult'}
              example: {type: setup_retry, data: {retrying: [wireless_debugging]}}
        '400': {description: invalid_input (no step with that key), $ref: '#/components/responses/Error'}
        '403': {description: carbon_only, $ref: '#/components/responses/Error'}
        '404': {description: device_not_found, $ref: '#/components/responses/Error'}
        '409': {description: 'conflict (nothing to retry); device_offline (the device, or the computer it pairs through)', $ref: '#/components/responses/Error'}
        '426': {description: 'upgrade_required: the connected app can''t retry setup', $ref: '#/components/responses/Error'}
        '429': {description: rate_limited, $ref: '#/components/responses/Error'}

  # ───────────────────────────── Devices ─────────────────────────────
  /api/v1/devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: List devices
      description: |
        `scope` defaults to `mine` for a Carbon and `accessible` for a Silicon (`extend device ls`).
        - `mine` (1.1): every device the Carbon paired (each of their pairs), whichever Team X-Org-ID names or none.
        - `accessible`: the devices the Silicon has a grant on in its X-Org-ID Team (required). A device several
          Carbons paired, with a grant through two of them, lists once per pair, each naming the other in
          `same_device`. Lists skip the at-use membership check, so a grant whose Carbon just left the Team may list
          until its next use or the membership sweep.
        - `team`: deprecated in 1.1. Devices are visible only to the Carbons who paired them, so it is always an empty
          page (200); it stays for the 1.0 website's "Team devices" tab.

        Pages are in device-id order and `next_cursor` is opaque. `online` is applied before paging (the service reads
        on until the page is full), so a page with a `next_cursor` always holds exactly `limit` devices. Within a page,
        online devices come first, then paired before removed, then by name.

        `include_removed=true` (only with `scope=mine`) also lists the Carbon's removed devices in this world,
        each with `removed_at` and `removed_reason`, so their activity logs stay reachable. Any other scope with
        `include_removed=true`, or a value other than `true` or `false`, is `422 invalid_input` with a hint. An `os`
        Extend doesn't know is `422` naming the ones it does.
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderSilicon'}
        - {$ref: '#/components/parameters/TestingSecret'}
        - name: scope
          in: query
          schema:
            type: string
            enum: [mine, accessible, team]
            description: '`team` is deprecated (1.1): always an empty page'
        - name: online
          in: query
          schema: {type: boolean}
        - name: os
          in: query
          schema: {$ref: '#/components/schemas/DeviceOs'}
        - name: include_removed
          in: query
          description: With scope=mine, also list the caller's removed devices
          schema: {type: boolean, default: false}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Devices; empty is still 200
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: devices}
                  data:
                    type: object
                    required: [items, next_cursor]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Device'}}
                      next_cursor: {type: [string, 'null']}
              example:
                type: devices
                data:
                  items:
                    - device_id: 7c1e09ab
                      name: Saket's Pixel
                      os: android
                      os_version: '15'
                      kind: phone
                      owner: {type: carbon, id: 'c:saket'}
                      visibility: personal
                      online: true
                      awake: true
                      awake_changed_at: '2026-09-26T09:57:40.120Z'
                      wake_detectable: true
                      last_seen_at: '2026-09-26T10:04:12.391Z'
                      in_use: {silicon_id: 'si:chef', session_id: a3f, since: '2026-09-26T09:58:00.000Z', team: acme}
                      last_used_at: '2026-09-26T10:04:10.002Z'
                      pair_ttl_days: 14
                      pair_expires_at: '2026-10-10T10:04:10.002Z'
                      days_left: 14
                      paired_by_others: false
                      wake_muted: false
                      open_wake_requests: 0
                      state: ready
                    - device_id: 0d44e1f2
                      name: Living room TV
                      os: android_tv
                      kind: tv
                      owner: {type: carbon, id: 'c:saket'}
                      visibility: personal
                      online: true
                      awake: false
                      sleep_state: standby
                      awake_changed_at: '2026-09-26T08:10:02.000Z'
                      wake_detectable: true
                      in_use_by_other: true
                      paired_by_others: true
                      open_wake_requests: 1
                      state: ready
                  next_cursor: null
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/devices/{device_id}:
    parameters:
      - {$ref: '#/components/parameters/DeviceId'}
    get:
      tags: [Devices]
      operationId: getDevice
      summary: One device, with what a Silicon can do on it (`extend device show`)
      description: |
        The Carbon who paired it (this pair's owner, in any Team), or a Silicon with a grant on it in its X-Org-ID Team.
        Anyone else gets `404 device_not_found`. A Silicon without a grant in X-Org-ID gets "No device 7c1e09ab is visible
        to you in team acme.", hinting "If a Carbon gave you access in another of your Teams, pass --team <that team>."
        Each viewer sees their own side (1.1): the owner sees `in_use` (with its Team) only when the session runs through
        their own pair, and otherwise `in_use_by_other` (or `in_use_by_other_carried` on a computer whose busy carried
        device they didn't pair); a Silicon sees `in_use` only for a Silicon on its own side, and `in_use_by_other`
        otherwise. Single reads also carry the viewer's open `wake_requests`.

        On a computer several Carbons paired, only the first pair (the Carbon who installed Silicon Extend on it) has
        `terminal`; every other pair lists it in `missing` with "Several Carbons paired this computer. Only Silicons
        given access by the Carbon who installed Silicon Extend on it can use its terminal. The screen, keyboard and apps
        work as usual." (the Carbon's decision of 2026-09-27).

        A removed device stays readable, read-only, for the Carbon who paired it: `removed_at` and
        `removed_reason` are set, `online` is false, `in_use`, `pair_expires_at` and `days_left` are left out,
        `capabilities` and `commands` are empty, and `missing[0]` is `{capability: screen.read, reason: "The device was
        removed, so nothing works on it any more. Pair it again to use it."}`. The same Carbon can also read its
        `/activity`, `/requests`, `/access` (now empty) and `/setup`. For anyone else a removed device is
        `404 device_not_found` with the plain not-found message.

        Every change to a removed device (`PATCH`, `DELETE` again, `/stop`, `/attachments`, `/setup/code`,
        `PUT`/`DELETE /access/{silicon_id}`, a Silicon's `POST /api/v1/sessions` or `/requests`) is
        `404 device_not_found`. For the Carbon who paired it the message is "Device <id> (<name>) was removed at
        <time>: <why>. A removed device can't be changed or used.", the hint points to
        `extend device activity <id>` and says to pair it again, and `details` are `{removed_at, removed_reason}`.
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderSilicon'}
        - {$ref: '#/components/parameters/TestingSecret'}
      responses:
        '200':
          description: Device with capabilities and the Extend commands they unlock
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: device}
                  data:
                    allOf:
                      - {$ref: '#/components/schemas/Device'}
                      - type: object
                        required: [capabilities, commands]
                        properties:
                          capabilities: {type: array, items: {$ref: '#/components/schemas/Capability'}}
                          missing:
                            type: array
                            description: Capabilities this kind of device supports but this one lacks right now, with why
                            items:
                              type: object
                              required: [capability, reason]
                              properties:
                                capability: {$ref: '#/components/schemas/Capability'}
                                reason: {type: string, example: Screen Recording permission is off on this Mac}
                          commands: {type: array, items: {type: string}, example: [snapshot, screenshot, click, fill, type, open, close, terminal]}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [Devices]
      operationId: updateDevice
      summary: Rename, change the pairing lifetime, or show/hide the shared in-use banner
      description: |
        Owner only: the name and lifetime are this Carbon's pair's own, so another Carbon who paired the same device
        keeps theirs. Send only the fields that change. `visibility` is accepted and ignored (1.1): every device is
        personal, and the answer says so. `in_use_indicator` is `shown` or `hidden` (1.1), and unlike the name and
        lifetime belongs to the physical device: every Carbon's pair shares the choice. Only a Carbon who owns a live
        pair may change it; a Silicon gets `403 carbon_only`. The current owner does not need every other owner's
        approval. Changed values refresh the live pair connections, or update every carried alias through its host.
        A 1.0 app may ignore the setting; its service-side value is still saved.
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderOptional'}
        - {$ref: '#/components/parameters/TestingSecret'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: {const: device}
                data:
                  type: object
                  additionalProperties: false
                  minProperties: 1
                  properties:
                    name: {$ref: '#/components/schemas/DeviceName'}
                    visibility: {$ref: '#/components/schemas/Visibility'}
                    pair_ttl_days: {$ref: '#/components/schemas/PairTtlDays'}
                    in_use_indicator: {$ref: '#/components/schemas/InUseIndicator'}
      responses:
        '200':
          description: Updated
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: device}
                  data: {$ref: '#/components/schemas/Device'}
        '403': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Devices]
      operationId: removeDevice
      summary: Remove the device (dangerous)
      description: |
        Owner only. Ends this Carbon's pair of the device: any session running through it (`device_removed`; a
        command in flight answers `409 session_ended` at once), every grant on it and its open wake requests; unpairs it
        (`unpaired` goes to that pair's connection only), and keeps it readable to its owner as a removed device (see
        `GET /api/v1/devices/{device_id}`), with its activity log. Other Carbons' pairs of the same device, and sessions
        through them, are untouched (1.1). Clients must confirm with the Carbon first; the CLI needs `--yes`. For a host
        computer, also removes every device paired through this pair. Removing a removed device again is
        `404 device_not_found`, not 204.
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderOptional'}
        - {$ref: '#/components/parameters/TestingSecret'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '204': {description: Removed}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
  /api/v1/devices/{device_id}/stop:
    parameters:
      - {$ref: '#/components/parameters/DeviceId'}
    post:
      tags: [Devices]
      operationId: stopDevice
      summary: Stop the Silicon using the device now
      description: |
        Owner only. Ends the running session with `stopped_by_carbon`; a command in flight answers `409 session_ended`
        at once and the device gets `cancel` for it. No running session is 409 `device_not_in_use`.

        1.1: every Carbon who paired a device may stop the Silicon using it (UNDERSTANDING.md, Always visible), so the
        stop ends the session on the physical device whichever Carbon's pair it runs through. For a computer it also ends
        the sessions on carried devices the caller paired too. It never ends a session on a carried device the caller
        didn't pair: when that is all that is busy, it answers `409 conflict`, "A device carried by Studio Mac is in use.
        It can be stopped by the Carbon who paired it, or from Studio Mac's Extend app." (the computer's own Stop still
        stops it). The answer is the stopped `session` when it ran through the caller's own pair (as in 1.0), and
        otherwise `device_stopped` (the Silicon isn't named). On the stopped session's pair, the activity log says
        `session_ended` by `extend`, `{"stopped_by": "another_carbon"}`, naming no one. A 1.0 client reads
        `device_stopped` as an error after the stop succeeded; it can reach it only by a race, since it never sees
        another side's session as in use.
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderOptional'}
        - {$ref: '#/components/parameters/TestingSecret'}
      responses:
        '200':
          description: The session that was ended (`session`), or `device_stopped` when it ran through another Carbon's pair
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [type, data]
                    properties:
                      type: {const: session}
                      data: {$ref: '#/components/schemas/Session'}
                  - type: object
                    required: [type, data]
                    properties:
                      type: {const: device_stopped}
                      data: {$ref: '#/components/schemas/DeviceStopped'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: 'device_not_in_use; conflict (only a carried device someone else paired is busy)', $ref: '#/components/responses/Error'}

  # ───────────────────────────── Access ─────────────────────────────
  /api/v1/devices/{device_id}/access:
    parameters:
      - {$ref: '#/components/parameters/DeviceId'}
    get:
      tags: [Access]
      operationId: listAccess
      summary: Silicons that can use the device
      description: |
        Owner only. Every grant on this pair, in every Team, each with its `team` and `wake_muted` (1.1). A removed device
        the caller paired answers with no grants. Grants in a Team the Carbon's login no longer reaches are listed too;
        clients mark them "Sign in to Extend for <team> to see names, add Silicons, open files and get Tings there".
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderOptional'}
        - {$ref: '#/components/parameters/TestingSecret'}
      responses:
        '200':
          description: Access grants
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: access}
                  data:
                    type: object
                    required: [items]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/AccessGrant'}}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/devices/{device_id}/access/{silicon_id}:
    parameters:
      - {$ref: '#/components/parameters/DeviceId'}
      - {$ref: '#/components/parameters/SiliconIdPath'}
    put:
      tags: [Access]
      operationId: grantAccess
      summary: Give a Silicon access
      description: |
        Owner only. The grant is for the Silicon's Team T: `?team=` if given, else X-Org-ID; neither is `422
        invalid_input`, "Say which Team the Silicon is in: --team <handle>". T can be any Team the Carbon is an active
        member of (1.1), but their Extend login must reach it: otherwise `403 not_a_team_member`, "c:alice's Extend login
        doesn't reach labs.", hinting "Sign in to Extend again and select labs (approve Extend for labs in Silicon IAM),
        then retry." The Silicon must be an active member of T (`422` otherwise). Repeating is a no-op that returns the
        existing grant. A Silicon may hold one grant per Team on a device; it uses the device as a member of the Team it
        acts in. The first grant in a Team registers the Carbon with Ting there (unless Extend already did), and
        clients then read `GET /api/v1/ting-registration?team=T` to warn about missing Ting types.
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderOptional'}
        - {$ref: '#/components/parameters/TeamQuery'}
        - {$ref: '#/components/parameters/TestingSecret'}
      responses:
        '200':
          description: Granted
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: access_grant}
                  data: {$ref: '#/components/schemas/AccessGrant'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Access]
      operationId: revokeAccess
      summary: Take a Silicon's access away
      description: |
        Owner only. With `?team=`, the grant in that Team; without it, the grant in every Team (the 1.0 meaning). It works
        on ownership alone, even for a Team the Carbon's login no longer reaches. If that Silicon is using the device
        through this pair in an affected Team, its session ends at once (`access_removed`): a command in flight answers
        `409 session_ended` and the device gets `cancel` for it (the device stays paired). Its open wake requests there
        are withdrawn.
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderOptional'}
        - {$ref: '#/components/parameters/TestingSecret'}
        - {$ref: '#/components/parameters/TeamQuery'}
      responses:
        '204': {description: 'Revoked, or there was no grant'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/team/silicons:
    get:
      tags: [Access]
      operationId: teamSilicons
      summary: Silicons in the team, for choosing who gets access
      description: |
        Any signed-in member of the team named by X-Org-ID. Read live from Silicon IAM.

        `?team=any` (1.1, Carbons): the Silicons of every Team the Carbon's login reaches, each with its `team`, and in
        `teams` how each Team's read went: a Team whose directory couldn't be read is `{team, ok: false, error}`, and
        the others still answer. X-Org-ID is not needed. Teams where the Carbon hasn't approved Extend are unknown to
        Extend; clients say "Don't see a Team? Sign in to Extend and select it."
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderSilicon'}
        - {$ref: '#/components/parameters/TestingSecret'}
        - name: team
          in: query
          required: false
          description: '`any`: every Team the Carbon''s login reaches (1.1)'
          schema: {type: string, enum: [any]}
      responses:
        '200':
          description: Silicons
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: team_silicons}
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/TeamSilicon'}
                      teams:
                        type: array
                        description: 'With team=any: how each Team''s directory read went (1.1)'
                        items: {$ref: '#/components/schemas/TeamReach'}

  # ───────────────────────────── Sessions ─────────────────────────────
  /api/v1/sessions:
    post:
      tags: [Sessions]
      operationId: startSession
      summary: Start using a device (`extend session new`)
      description: |
        Silicons only; the caller needs a grant on the device in its X-Org-ID Team, and the device must be online and
        set up. Takes the device's lock: only one Silicon at a time, across every Carbon's pair of the physical device
        and every Team (1.1). A computer and the devices it carries form one lock group: a Silicon can't start on one of
        them while a Silicon on another side uses any of them ("Living room TV pairs through Studio Mac, and something on
        that computer is in use."). The session ends on its own after 300 s without a command (a command in flight holds
        the timer). Starting a session also registers the Silicon as a Ting recipient, in the background (a failure is
        logged and the session goes on), so requests for the device can reach it.

        If another Silicon holds it, 409 `device_in_use` with the `extend request send` command as `hint`:
        - on the caller's own side (same Team, same Carbon's pair), or the caller's own session: the message and
          `details.in_use` name the Silicon, its session and since when, as in 1.0;
        - otherwise nothing names it (1.1): "Device 7c1e09ab (Living room TV) is in use. Only one Silicon can use a
          device at a time.", hint "Ask for it: extend --team labs request send 7c1e09ab --reason \"...\"", and
          `details: {"in_use": {"hidden": true}}`.

        Before starting, Extend checks that the Carbon who gave the access is still an active member of the Silicon's
        Team (the owner-active check, TECHNICAL.md section 9): a definite "not a member" is `403 no_access` ("c:alice,
        who gave you access to Living room TV, is no longer an active member of labs, so her access grants in labs
        ended.", hint "Ask a Carbon in labs who owns a device to give you access."). When IAM can't say, the session
        starts.

        A device that isn't awake still starts (201): awake never refuses anything. The CLI then prints the wake hint.
        When Extend can't tell whether the device is awake, starting a session withdraws the caller's own open wake
        request on it (`session_started`); when it knows the device isn't awake, the request stays open.

        A refused login ends access on every session route (`POST`/`GET /api/v1/sessions`, `GET /sessions/{id}`,
        `/end`, `/takeover`, `/commands`), even when no IAM webhook arrives. This works when Extend can tell which
        Silicon the refused token belonged to (a login it saw that Silicon use in this world since it started):
        - `403 not_a_team_member` for the `X-Org-ID` team where the Silicon has running sessions: unless IAM confirms
          it is still an active member there, those sessions end at once as `left_team`, and the message adds
          "Its running session(s) <ids> in <team> ended (left_team)."
        - `401 token_expired`: 15 s later, unless IAM accepts another login of that Silicon that Extend has seen, all
          its running sessions in this world end as `silicon_logged_out` (a refreshed token keeps them). If IAM can't
          answer, nothing ends.
      parameters:
        - {$ref: '#/components/parameters/TeamHeader'}
        - {$ref: '#/components/parameters/TestingSecret'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: {const: session}
                data:
                  type: object
                  additionalProperties: false
                  required: [device_id]
                  properties:
                    device_id: {$ref: '#/components/schemas/DeviceIdValue'}
      responses:
        '201':
          description: Started
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: session}
                  data: {$ref: '#/components/schemas/Session'}
              example:
                type: session
                data:
                  session_id: a3f
                  device_id: 7c1e09ab
                  silicon_id: 'si:chef'
                  state: active
                  started_at: '2026-09-26T10:00:00.000Z'
                  last_command_at: null
                  idle_ends_at: '2026-09-26T10:05:00.000Z'
                  ended_at: null
                  end_reason: null
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: The caller's sessions (`extend session ls`)
      description: |
        A Silicon sees its own sessions in its X-Org-ID Team. A Carbon sees the sessions through their own pairs, in
        every Team, each with its `team`; X-Org-ID is not needed (1.1).
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderSilicon'}
        - {$ref: '#/components/parameters/TestingSecret'}
        - name: device_id
          in: query
          schema: {$ref: '#/components/schemas/DeviceIdValue'}
        - name: state
          in: query
          schema: {type: string, enum: [active, paused, ended]}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Sessions, newest first
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: sessions}
                  data:
                    type: object
                    required: [items, next_cursor]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Session'}}
                      next_cursor: {type: [string, 'null']}
  /api/v1/sessions/{session_id}:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    get:
      tags: [Sessions]
      operationId: getSession
      summary: One session (used by `extend session connect` and `status`)
      description: While a command runs, `idle_ends_at` is held at least 300 s after the command's deadline.
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderSilicon'}
        - {$ref: '#/components/parameters/TestingSecret'}
      responses:
        '200':
          description: Session with its device and capabilities
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: session}
                  data:
                    allOf:
                      - {$ref: '#/components/schemas/Session'}
                      - type: object
                        required: [device, capabilities, commands]
                        properties:
                          device: {$ref: '#/components/schemas/Device'}
                          capabilities: {type: array, items: {$ref: '#/components/schemas/Capability'}}
                          commands: {type: array, items: {type: string}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/sessions/{session_id}/end:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    post:
      tags: [Sessions]
      operationId: endSession
      summary: Finish and free the device (`extend session end`)
      description: The Silicon that started it. Ending an ended session returns it unchanged. A command in flight is cancelled.
      parameters:
        - {$ref: '#/components/parameters/TeamHeader'}
        - {$ref: '#/components/parameters/TestingSecret'}
      responses:
        '200':
          description: Ended
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: session}
                  data: {$ref: '#/components/schemas/Session'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/sessions/{session_id}/takeover:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    post:
      tags: [Sessions]
      operationId: startTakeover
      summary: Pause and hand the device to its Carbon (`extend takeover`)
      description: |
        The session becomes `paused`; commands get 423 `session_paused`. The device and website show the reason and a
        Done button. The idle timer stops for up to 30 minutes.
      parameters:
        - {$ref: '#/components/parameters/TeamHeader'}
        - {$ref: '#/components/parameters/TestingSecret'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: {const: takeover}
                data:
                  type: object
                  additionalProperties: false
                  required: [reason]
                  properties:
                    reason: {type: string, minLength: 1, maxLength: 300, example: Please approve the Face ID prompt}
      responses:
        '201':
          description: Paused
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: takeover}
                  data: {$ref: '#/components/schemas/Takeover'}
        '409': {$ref: '#/components/responses/Error'}
    get:
      tags: [Sessions]
      operationId: getTakeover
      summary: Whether the session is paused for the Carbon (`extend takeover status`)
      description: The session's Silicon, or the Carbon who owns the device (the website shows the reason and a Done button from this).
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderSilicon'}
        - {$ref: '#/components/parameters/TestingSecret'}
      responses:
        '200':
          description: Current takeover, or `null`
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: takeover}
                  data: {oneOf: [{$ref: '#/components/schemas/Takeover'}, {type: 'null'}]}
    delete:
      tags: [Sessions]
      operationId: releaseTakeover
      summary: Resume the session (`extend takeover release`, or the Carbon's Done on the website)
      description: The session's Silicon, or the Carbon who owns the device.
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderSilicon'}
        - {$ref: '#/components/parameters/TestingSecret'}
      responses:
        '204': {description: Resumed}
        '409': {$ref: '#/components/responses/Error'}

  # ───────────────────────────── Commands ─────────────────────────────
  /api/v1/sessions/{session_id}/commands:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    post:
      tags: [Commands]
      operationId: runCommand
      summary: Run one command on the device
      description: |
        Every device engine command Extend exposes, plus Extend's additions (`terminal`, `adb`, `display`,
        `notifications`), goes through here. `command` is the top-level name as typed after `extend`, and `args` are
        the remaining command-line tokens exactly as the device engine's command line accepts them, so the engine's own
        parser stays the authority on arguments. Flags that pick a device or session inside the engine (`--platform`,
        `--device`, `--udid`, `--serial`, `--target`, `--session`, `--remote`) are refused: Extend picks those.
        `cli.yaml` lists every command and its arguments.

        Awake is never a gate (1.1): the terminal, Android debugging and every other command run while the device isn't
        awake. A command that needs the screen fails with the device's own error; when the device is known not to be
        awake, the answer (a failed result, `unsupported_on_device` or `device_offline`) carries the wake hint. On a
        computer several Carbons paired, `terminal` works only through the first pair (the Carbon who installed Silicon
        Extend on it); through any other pair it is `422 unsupported_on_device` with that reason.

        Before running, Extend re-checks with IAM that the caller still has access (its grant in the session's Team, and
        that the Carbon who gave it is still an active member there), that the session is theirs and `active`, that the
        device is online, and that the command is in the device's capabilities. Commands in one
        session run one at a time, in order; a command that waited behind another checks the session again when its
        turn comes (`409 session_ended` or `423 session_paused`, never relayed). While the command runs,
        `idle_ends_at` is held at `timeout_ms` + 2 s + 300 s from its start; when the answer comes (or the command times
        out, or the device drops), the 300 s idle window restarts from then.

        If the session ends while the command runs (the device removed, the pair revoked, access removed, a Stop by any
        Carbon who paired the device, a logout, leaving the team, the test environment disabled or cleaned), the caller gets
        `409 session_ended` at once (within about 200 ms), not at the deadline: "Session <id> ended while `<command>` was
        running on <device>: <why>. `<command>` may have run.", a hint for that end reason, and
        `details: {end_reason, command_id, may_have_run: true}`. The device gets `cancel` for it if still connected, and
        the activity log records the outcome as `unknown`. A dropped socket or a passed deadline whose session had
        ended answers the same way instead of `device_offline` or `command_timeout`.

        Files the command makes are stored in Briefcase for the Silicon, shared with the device's owner, and returned
        in `files`. `self_destruct_minutes` (1 to 43,200; default 1,440) applies to every file this command makes;
        `permanent: true` keeps them. Small inputs a command reads from the caller's machine (a replay script, an
        image to show on a TV, an APK to install) travel in `attachments`: at most 8 and 8 MiB in total.

        For `display show --image` or `--video`, a 1.1 service also resolves `file:<file_id>`, a bare file UUID, the
        stored Extend content link, or the exact Briefcase permanent URL recorded by Extend. These name files Extend
        already stored for the calling Silicon in this session's Team and world; they do not authorize arbitrary
        Briefcase entries. Expired, unknown or another Silicon's files give `404 file_not_found`. The recorded content
        type must match image/video. Extend reads bounded bytes from Briefcase on the Silicon's behalf, checks visibility
        again after the read and checks that the session is still active before forwarding. The resulting ordinary
        attachment shares the same 8-file/8-MiB total with local inputs. No credentials or private media URL go to the
        device. Unrelated public media URLs stay device-side URLs; this is not a service URL-fetch endpoint.
        This resolution is for display media only; install, replay and screenshot baselines still require local inputs.

        On Android TV apps 1.1 or later, a primary element `click` (`@ref` or selector) needs `screen.read`, rather than
        pointer/touch injection. The service keeps the old requirement for apps older than 1.1 or with an unknown app
        version. Coordinates, held/repeated or secondary clicks still need the corresponding native injection support;
        no new pointer/touch capability is advertised. A missing/damaged image on the native TV returns a failed command
        result (`action_failed`), rather than success while a blank image remains.

        On a carried iPhone/iPad, the first plain screenshot binds an engine session to the current device with a bare
        `open` when necessary, then retries the capture within the same command deadline. It launches no app and starts
        no runner for a plain capture. Ref overlays or selector cropping may need the runner. This does not make the
        device's lock state detectable or change the existing capture permission/setup requirements.

        A file that can't be kept doesn't fail the command: `ok` is unchanged and `warnings` gets one entry per
        problem, each saying what happened, why and what to do (a file the device listed under an upload id not issued
        for this command, or never uploaded; Briefcase refused to store it; it was stored but not shared with the
        device's Carbon; it was stored but Extend could not record it, in which case the warning gives its link and it
        won't be listed or self-destruct). Warnings also go to the command's activity entry (`details.warnings`).

        A result with `ok: false` ran on the device and failed there; `error.code` says how. Besides the device engine's own
        codes, a device answers `command_failed` (a shell exited non-zero; `details.exit_code`), `action_failed`,
        `upload_failed` (a file it made could not be uploaded), `cancelled` (Extend cancelled it), `session_ended` (the
        Carbon pressed Stop or the session ended while it ran or waited) and, on Android, `device_not_ready` (Android
        debugging was disconnected).
      parameters:
        - {$ref: '#/components/parameters/TeamHeader'}
        - {$ref: '#/components/parameters/TestingSecret'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: {const: command}
                data:
                  type: object
                  additionalProperties: false
                  required: [command]
                  properties:
                    command: {type: string, example: click, description: Top-level command name}
                    args: {type: array, items: {type: string}, default: [], example: ['@e2']}
                    attachments:
                      type: array
                      maxItems: 8
                      description: At most 8 attachments and 8 MiB (8,388,608 bytes) decoded in total per command.
                      items:
                        type: object
                        required: [name, content_type, content_base64]
                        properties:
                          name: {type: string}
                          content_type: {type: string}
                          content_base64: {type: string, description: Counts toward the 8 MiB total}
                    timeout_ms: {type: integer, minimum: 1000, maximum: 300000, default: 30000}
                    self_destruct_minutes: {type: integer, minimum: 1, maximum: 43200, default: 1440}
                    permanent: {type: boolean, default: false}
            examples:
              snapshot: {value: {type: command, data: {command: snapshot, args: ['-i']}}}
              click: {value: {type: command, data: {command: click, args: ['@e2']}}}
              fill: {value: {type: command, data: {command: fill, args: ['@e3', hello]}}}
              screenshot: {value: {type: command, data: {command: screenshot, args: ['--scale', '0.5'], self_destruct_minutes: 10080}}}
              tvRemote: {value: {type: command, data: {command: tv-remote, args: [press, select]}}}
              terminal: {value: {type: command, data: {command: terminal, args: [run, 'ls -la ~/Downloads', '--cwd', '~'], timeout_ms: 20000}}}
      responses:
        '200':
          description: The command ran. `ok` false means it ran and failed on the device (for example `is visible` was false); see `error`.
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: command_result}
                  data: {$ref: '#/components/schemas/CommandResult'}
              example:
                type: command_result
                data:
                  command_id: 01926f40-1b2c-7d3e-8f40-5a6b7c8d9e0f
                  session_id: a3f
                  command: screenshot
                  ok: true
                  output: {width: 540, height: 1200}
                  text: 'Saved screenshot (540x1200)'
                  files:
                    - file_id: 6e1f2a9c-3b4d-4e5f-8a7b-9c0d1e2f3a4b
                      name: screenshot-a3f-2026-09-26T10-04-12Z.png
                      kind: screenshot
                      content_type: image/png
                      size_bytes: 184223
                      url: 'https://briefcase.teamofsilicons.com/org/acme/apps/extend/private/si:chef/screenshot-a3f-2026-09-26T10-04-12Z.png'
                      self_destruct_at: '2026-09-27T10:04:12.391Z'
                      permanent: false
                  error: null
                  started_at: '2026-09-26T10:04:12.001Z'
                  duration_ms: 390
                  idle_ends_at: '2026-09-26T10:09:12.391Z'
                  warnings: []
        '401': {description: 'token_expired, not_signed_in (see startSession: a refused Silicon''s sessions may end)', $ref: '#/components/responses/Error'}
        '403': {description: 'access_removed, not_session_owner, not_a_team_member', $ref: '#/components/responses/Error'}
        '404': {description: 'unknown_command (names the Extend replacement if any), session_not_found', $ref: '#/components/responses/Error'}
        '409': {description: 'session_ended (details.end_reason; when it ended mid-command also command_id and may_have_run)', $ref: '#/components/responses/Error'}
        '422': {description: 'invalid_input, unsupported_on_device (names the missing capability)', $ref: '#/components/responses/Error'}
        '423': {description: session_paused, $ref: '#/components/responses/Error'}
        '503': {description: device_offline, $ref: '#/components/responses/Error'}
        '504': {description: command_timeout, $ref: '#/components/responses/Error'}

  # ───────────────────────────── Requests ─────────────────────────────
  /api/v1/devices/{device_id}/requests:
    parameters:
      - {$ref: '#/components/parameters/DeviceId'}
    post:
      tags: [Requests]
      operationId: sendRequest
      summary: Ask for a device another Silicon is using (`extend request send`)
      description: |
        Silicons with access only, and only while another Silicon is using the device (otherwise 409
        `device_not_in_use` with a hint to start a session; the caller's own session is `409 conflict`). The reason is
        kept exactly as sent: surrounding whitespace included, it is stored, returned, logged and sent unchanged. Its
        length is counted without the surrounding whitespace (1–300 Unicode scalar values), and the raw text may be at
        most 1,000 including it; either refusal is `422 invalid_input` with a hint.

        Who gets it (1.1, UNDERSTANDING.md "One Silicon at a time"):
        - When the Silicon using the device is in the caller's Team and was given access by the same Carbon (through the
          same pair), the request goes to that Silicon through Ting, as in 1.0: `routed_to: holder`, and `to` names it.
        - Otherwise it goes to the Carbon who gave the Silicon using the device access, who can stop the session:
          `routed_to: carbon`. The caller sees `to` as "the Carbon who gave access to the Silicon using it" with
          `to_hidden: true` and no `session_id`, even when that Carbon is its own; it never learns which Carbon,
          Silicon or session holds the device. That Carbon sees the requesting Silicon (`from`) and the reason (the
          Carbon's decision of 2026-09-27), on the website, in `extend device requests` and in the Ting. The Ting goes
          at once, from the requesting Silicon, when the two share a Team (sent in it); otherwise it goes from that
          Carbon's own login, as a notification to themselves, in the Team where they gave the holder access: at once
          when Extend holds that login, else at their next use of Extend. The website and CLI show it at once either
          way. It never names the Silicon using the device, its Team or its session.
        `from_hidden` is never set by a 1.1.0 service.

        Every new reason is a new request (201) and is delivered. Only a repeat is folded: the byte-identical reason
        from the same Silicon in the same Team, for the same device and the same session on it, within 60 s returns the
        existing request (200) and sends nothing. The same `Idempotency-Key` with the same body replays its request; with a different
        body it is `409 conflict`.

        If Ting refuses or can't be reached, the request is stored with `delivery: pending` and `last_error` saying why,
        and the answer is still 201. Extend retries with the exact body it first sent, backing off 30 s, then 1, 2, 4
        and 8 minutes, then every 8 minutes, acting with the latest login it holds for the sender in that Team and
        world (no running session needed); an attempt with no login held doesn't count. After 6 counted attempts or 24
        hours it becomes `failed` with `last_error` saying why and to send it again, and the device's activity log gets
        `request_failed`. A recipient who turned Extend's Tings off stops the retries until they turn them on again
        (`PUT /api/v1/ting-registration`). When Ting doesn't know `extend.device.requested` for this app/context,
        `last_error` says so and gives the command the app-owning Team's Ting manager runs to register it. The requester's side sees
        a routed request's `last_error` only as "Not delivered yet; it is retried." or "It couldn't be delivered.".
      parameters:
        - {$ref: '#/components/parameters/TeamHeader'}
        - {$ref: '#/components/parameters/TestingSecret'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: {const: request}
                data:
                  type: object
                  additionalProperties: false
                  required: [reason]
                  properties:
                    reason:
                      type: string
                      minLength: 1
                      maxLength: 1000
                      description: 1–300 Unicode scalar values after trimming; at most 1,000 with the surrounding whitespace, which is kept
            example: {type: request, data: {reason: 'I need to check the order confirmation in the Swiggy app, 2 minutes'}}
      responses:
        '200':
          description: A repeat of the same reason within 60 s; the existing request, nothing sent
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: request}
                  data: {$ref: '#/components/schemas/Request'}
        '201':
          description: Sent, or stored as pending with last_error
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: request}
                  data: {$ref: '#/components/schemas/Request'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: 'device_not_in_use; conflict (you are the one using it, or an Idempotency-Key reused with another body)', $ref: '#/components/responses/Error'}
        '429': {description: rate_limited, $ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    get:
      tags: [Requests]
      operationId: listDeviceRequests
      summary: Requests for this device, with reasons (device page)
      description: |
        Owner only. Also answers for a removed device the caller paired. 1.1: the requests the Carbon's Silicons sent
        through this pair (in every Team, tagged with `team`), and the requests routed to this Carbon because a Silicon
        they gave access to was using the device through this pair (`routed_to: carbon`, with `from` naming the
        requesting Silicon, `session_id` the session it asked for, and `device_id` this pair).
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderOptional'}
        - {$ref: '#/components/parameters/TestingSecret'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Requests, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequestPage'}
  /api/v1/requests:
    get:
      tags: [Requests]
      operationId: listMyRequests
      summary: Requests the calling Silicon sent or received (`extend request ls`)
      description: |
        In the caller's X-Org-ID Team only (1.1): the ones it sent, and the ones sent to it as the Silicon using a device.
        A request routed to a Carbon shows `to` as "the Carbon who gave access to the Silicon using it".
      parameters:
        - {$ref: '#/components/parameters/TeamHeader'}
        - {$ref: '#/components/parameters/TestingSecret'}
        - name: direction
          in: query
          schema: {type: string, enum: [sent, received, all], default: all}
        - name: device_id
          in: query
          schema: {$ref: '#/components/schemas/DeviceIdValue'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Requests, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequestPage'}

  # ───────────────────────────── Waking (1.1) ─────────────────────────────
  /api/v1/devices/{device_id}/wake-requests:
    parameters:
      - {$ref: '#/components/parameters/DeviceId'}
    post:
      tags: [Waking]
      operationId: askToWake
      summary: Ask the Carbon to wake a device that isn't awake (`extend device wake`)
      description: |
        A Silicon with a grant on this pair in its X-Org-ID Team T. Extend never wakes a device itself; the Carbon does
        (UNDERSTANDING.md, Waking a device). Where it can, the device shows a notification with the Silicon's name and
        reason (an Android phone's lock screen, a computer's notifications); the Carbon who gave the Silicon access gets
        `extend.device.wake_requested` through Ting, in T. When the device is turned on or unlocked, every Silicon that
        asked gets `extend.device.woken` in its own Team.

        Body `{"type": "wake_request", "data": {"reason": "..."}}`: 1–300 characters after trimming, at most 1,000 raw,
        kept exactly as written. `Idempotency-Key` replays the stored answer.

        Checks, in order:
        1. `403 silicon_only`.
        2. `404 device_not_found`, or `403 no_access` with the grant hint.
        3. The owner-active check (TECHNICAL.md section 9).
        4. `422 invalid_input` for a bad reason.
        5. `409 conflict` when the Carbon turned wake requests off for this pair, or for this Silicon on it: "c:alice
           has turned off wake requests for Living room TV."
        6. `409 device_in_use` when another Silicon uses the device (or, on a computer, a device it carries), with the
           same text as `POST /api/v1/sessions` (naming no one when it is another side) and the request-send hint. The
           Silicon using the device may ask.
        7. `409 conflict` when the device is online and awake: "Living room TV is already awake", hint
           `extend --team T session new <id>`.
        8. The caller already has an open request for this physical device in T: asked less than 300 s ago is
           `429 rate_limited` with `details: {retry_after_s, wake_request}` (its own request only); otherwise the
           request is refreshed (the new reason, `asks` + 1, expiring 1,800 s from now) and the answer is 200.
        9. No open request, but its last one for this device in T was asked less than 300 s ago and didn't end
           woken: `429 rate_limited`.

        It is accepted while the device is offline or its awake state is unknown. `device_notice` says what the device
        did: `sent`, then `shown` or `not_shown` (with `device_notice_note`) when the app answers; `offline`; or
        `unsupported` (a device paired through a computer, or an app older than 1.1). `wake_detectable: false` means
        Extend can't tell when it wakes (iPhone, iPad, apps older than 1.1): the Carbon says so with "It's awake".

        Limits (TECHNICAL.md section 5): the device sounds at most once every 15 minutes; one Carbon Ting per pair and
        Team every 15 minutes (a later ask's `ting` is `covered`, with `ting_covered_by`); at most 6 wake Tings per
        Carbon per hour, beyond which the ask is still accepted and its Ting waits for the hour's window (`deferred`,
        which the Silicon sees as `pending`). An ask is never refused because of what other Teams did. When Ting doesn't
        know `extend.device.wake_requested` for the app/context, `ting_last_error` names the missing type and gives
        the app-owning Team manager's register command, not the delivery Team T.
      parameters:
        - {$ref: '#/components/parameters/TeamHeader'}
        - {$ref: '#/components/parameters/TestingSecret'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: {const: wake_request}
                data: {$ref: '#/components/schemas/WakeCreate'}
            example: {type: wake_request, data: {reason: 'I need the TV on to check the order screen'}}
      responses:
        '200':
          description: Asked again after 5 minutes; the refreshed request
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: wake_request}
                  data: {$ref: '#/components/schemas/WakeRequest'}
        '201':
          description: Asked
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: wake_request}
                  data: {$ref: '#/components/schemas/WakeRequest'}
        '403': {description: 'silicon_only, no_access', $ref: '#/components/responses/Error'}
        '404': {description: device_not_found, $ref: '#/components/responses/Error'}
        '409': {description: 'conflict (already awake, wake requests turned off, open through another pair of the same device); device_in_use', $ref: '#/components/responses/Error'}
        '422': {description: invalid_input, $ref: '#/components/responses/Error'}
        '429': {description: 'rate_limited: asked less than 5 minutes ago (details.retry_after_s, details.wake_request)', $ref: '#/components/responses/Error'}
    get:
      tags: [Waking]
      operationId: listWakeRequests
      summary: Wake requests on the device (`extend device wake-requests ls`)
      description: |
        The Carbon who paired this pair sees every request made through it, in every Team, each with its `team`. A
        Silicon sees its own, in its X-Org-ID Team. Anyone else gets 404. Newest first.
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderSilicon'}
        - {$ref: '#/components/parameters/TestingSecret'}
        - name: state
          in: query
          schema: {type: string, enum: [open, all], default: all}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Wake requests
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: wake_requests}
                  data:
                    type: object
                    required: [items, next_cursor]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/WakeRequest'}}
                      next_cursor: {type: [string, 'null']}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/devices/{device_id}/wake-requests/{wake_id}:
    parameters:
      - {$ref: '#/components/parameters/DeviceId'}
      - {$ref: '#/components/parameters/WakeId'}
    delete:
      tags: [Waking]
      operationId: cancelWakeRequest
      summary: Withdraw your own wake request (`extend device wake <id> --cancel`)
      description: |
        The Silicon that asked, in the request's Team. The request ends as `withdrawn` (`cancelled`), the device drops
        it, and the activity log records `wake_cancelled`. Anyone else gets `404 request_not_found`; an ended request is
        `409 conflict`.
      parameters:
        - {$ref: '#/components/parameters/TeamHeader'}
        - {$ref: '#/components/parameters/TestingSecret'}
      responses:
        '204': {description: Withdrawn}
        '404': {description: request_not_found, $ref: '#/components/responses/Error'}
        '409': {description: 'conflict: it already ended', $ref: '#/components/responses/Error'}
  /api/v1/devices/{device_id}/wake-requests/answer:
    parameters:
      - {$ref: '#/components/parameters/DeviceId'}
    post:
      tags: [Waking]
      operationId: answerWakeRequests
      summary: The Carbon answers "It's awake" or "Decline" (`extend device wake-requests answer`, the website)
      description: |
        The Carbon who paired this pair.
        - `woken` ("It's awake") is a fact about the device: every open request on the physical device ends as woken
          (`confirmed_by_carbon`), made through any Carbon's pair and in any Team, and `wake_ids` is ignored. Each
          Silicon that asked gets its own `extend.device.woken` in its own Team, naming no one. This matters where
          Extend can't tell when a device wakes (iPhone, iPad, 1.0 apps). `409 conflict` when nothing is open on the
          device.
        - `declined` ends the requests on this Carbon's own pair (or the listed `wake_ids`, which must be on it), and
          each Silicon that asked gets `extend.device.wake_declined` naming this Carbon. Other Carbons' requests are
          never touched. `409 conflict` when nothing is open on the pair.
        The answer lists the requests on this Carbon's own pair that it ended; other Carbons' are never listed.
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderOptional'}
        - {$ref: '#/components/parameters/TestingSecret'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: {const: wake_answer}
                data: {$ref: '#/components/schemas/WakeAnswer'}
            examples:
              woken: {value: {type: wake_answer, data: {answer: woken}}}
              declined: {value: {type: wake_answer, data: {answer: declined}}}
      responses:
        '200':
          description: Answered
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: wake_answer}
                  data: {$ref: '#/components/schemas/WakeAnswered'}
        '403': {description: 'carbon_only, not_owner', $ref: '#/components/responses/Error'}
        '404': {description: device_not_found, $ref: '#/components/responses/Error'}
        '409': {description: 'conflict: nothing is open', $ref: '#/components/responses/Error'}
        '422': {description: 'invalid_input: a wake_id that isn''t on this pair', $ref: '#/components/responses/Error'}
  /api/v1/devices/{device_id}/wake-settings:
    parameters:
      - {$ref: '#/components/parameters/DeviceId'}
    put:
      tags: [Waking]
      operationId: setWakeSettings
      summary: Turn wake requests off or on for a device, or for one Silicon (`extend device wake-requests mute|unmute`)
      description: |
        The Carbon who paired this pair. Without `silicon_id`, for the whole pair; with it, for that Silicon's grants on
        this pair in every Team, or only in `team` (no grant is `422`). Turning them off withdraws the matching open
        requests (`muted`) and removes them from the device.
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderOptional'}
        - {$ref: '#/components/parameters/TestingSecret'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: {const: wake_settings}
                data: {$ref: '#/components/schemas/WakeSettings'}
            examples:
              device: {value: {type: wake_settings, data: {muted: true}}}
              oneSilicon: {value: {type: wake_settings, data: {muted: true, silicon_id: 'si:chef', team: labs}}}
      responses:
        '200':
          description: The pair's wake settings now
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: wake_settings}
                  data: {$ref: '#/components/schemas/WakeSettingsView'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {description: 'invalid_input: the Silicon has no grant on this pair (in that Team)', $ref: '#/components/responses/Error'}

  # ───────────────────────────── Ting (1.1) ─────────────────────────────
  /api/v1/ting-registration:
    get:
      tags: [Ting]
      operationId: tingRegistration
      summary: Recipient registration in a Team, and missing app types observed there (`extend ting status`)
      description: |
        Any signed-in member, about themselves. `?team=<handle>` answers one `ting_registration`; `?team=any` (Carbons)
        answers a list: every Team the Carbon's login reaches, plus the Teams of their grants (a Team outside their
        login's reach says "Sign in to Extend for <team>" in `last_error`).

        `status` is `on`, `off` (the member turned Extend's Tings off in Ting; Extend never re-registers them on its own)
        or `pending` (not registered yet: Extend needs the member's login for that Team; a member who was never
        registered is never shown as `off`). Extend registers a Carbon automatically once per Team (at their first
        grant there, a claim, or their first signed-in call after 1.1) and a Silicon at session start and when it asks
        to wake a device.

        `missing_types` records full type names that Ting reported missing while sending in this Team. It is a
        delivery-status cache, not a per-Team type catalog. Ting 0.1.9 resolves types by context (production/test
        environment) and app, across delivery Teams. Register Extend's four types once through the app-owning Team's
        authorized Ting manager in each used context. The delivery Team is not necessarily the owning Team.
        When the owner is not known, clients show an explicit, shell-quoted placeholder, for example
        `ting --org '<owning-team>' types register --type extend.device.wake_requested --description 'A Silicon asks its
        Carbon to wake a device'`, and explain that the manager replaces it with Extend's owning Team.
        Ting's published OBO catalog has no `types.register` endpoint. Extend does not attempt automatic type registration.
        Reading this status or turning recipient registration on does not clear a missing-type warning. The next
        successful delivery of that type in this Team clears the corresponding observation; pending errors stay visible
        while normal retry rules apply. Recipients, grants and actual deliveries remain scoped to their Team/context.
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderOptional'}
        - {$ref: '#/components/parameters/TestingSecret'}
        - name: team
          in: query
          required: true
          description: A Team handle, or `any` (Carbons)
          schema: {type: string}
      responses:
        '200':
          description: The registration, or with team=any a list of them
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [type, data]
                    properties:
                      type: {const: ting_registration}
                      data: {$ref: '#/components/schemas/TingRegistration'}
                  - type: object
                    required: [type, data]
                    properties:
                      type: {const: ting_registrations}
                      data:
                        type: object
                        required: [items]
                        properties:
                          items: {type: array, items: {$ref: '#/components/schemas/TingRegistration'}}
        '403': {description: not_a_team_member, $ref: '#/components/responses/Error'}
    put:
      tags: [Ting]
      operationId: tingTurnOn
      summary: Turn on Extend's Tings for you in a Team (`extend ting on`, Settings' "Turn on")
      description: |
        Registers the caller with Ting in `team` again, with their own login authorized for that Team (so it also undoes
        an "off" they chose in Ting), and retries the Tings waiting for them there. This registers the recipient only;
        it neither registers notification types nor clears their missing-type observations. The login must reach the
        Team (`403 not_a_team_member` otherwise). Answers the registration as it is now.
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderOptional'}
        - {$ref: '#/components/parameters/TestingSecret'}
        - name: team
          in: query
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type: {const: ting_registration}
                data: {type: object}
      responses:
        '200':
          description: The registration now
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: ting_registration}
                  data: {$ref: '#/components/schemas/TingRegistration'}
        '403': {description: not_a_team_member, $ref: '#/components/responses/Error'}
        '503': {description: 'service_unavailable: Ting could not be reached; nothing changed', $ref: '#/components/responses/Error'}

  # ───────────────────────────── Activity ─────────────────────────────
  /api/v1/devices/{device_id}/activity:
    parameters:
      - {$ref: '#/components/parameters/DeviceId'}
    get:
      tags: [Activity]
      operationId: listActivity
      summary: Every action on the device, which Silicon did it, and when
      description: |
        Owner only. Typed text and clipboard writes are redacted to `[redacted N chars]`. The log of a removed device
        stays readable to the Carbon who paired it (find it with `GET /api/v1/devices?include_removed=true`).

        1.1: the log is this Carbon's pair's own: every Team's entries, each Silicon entry tagged with its `team`. It
        never names another Carbon, their Silicons, Teams or sessions: another Carbon pairing the device is
        `another_carbon_paired`, and a Stop by another Carbon who paired it is `session_ended` by `extend` with
        `{"stopped_by": "another_carbon"}`. New actions are listed under `ActivityEntry`.
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderOptional'}
        - {$ref: '#/components/parameters/TestingSecret'}
        - name: silicon_id
          in: query
          schema: {$ref: '#/components/schemas/SiliconId'}
        - name: session_id
          in: query
          schema: {$ref: '#/components/schemas/SessionIdValue'}
        - name: since
          in: query
          schema: {type: string, format: date-time}
        - name: until
          in: query
          schema: {type: string, format: date-time}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Entries, newest first
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: activity}
                  data:
                    type: object
                    required: [items, next_cursor]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/ActivityEntry'}}
                      next_cursor: {type: [string, 'null']}
        '403': {$ref: '#/components/responses/Error'}

  # ───────────────────────────── Files ─────────────────────────────
  /api/v1/files:
    get:
      tags: [Files]
      operationId: listFiles
      summary: Files made in the caller's sessions (Silicon) or on the caller's devices (Carbon)
      description: |
        A Silicon sees the files it made in its X-Org-ID Team. A Carbon sees the files made through their own pairs, in
        every Team, each with its `team`; X-Org-ID is not needed (1.1). A file is stored in the Silicon's Team and shared
        with the Carbon who gave that Silicon access (the owner of the pair it used).
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderSilicon'}
        - {$ref: '#/components/parameters/TestingSecret'}
        - name: session_id
          in: query
          schema: {$ref: '#/components/schemas/SessionIdValue'}
        - name: device_id
          in: query
          schema: {$ref: '#/components/schemas/DeviceIdValue'}
        - name: kind
          in: query
          schema: {$ref: '#/components/schemas/FileKind'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: |
            Files, newest first. A file whose self-destruct time has passed is omitted at once, also while Extend is
            still deleting it from Briefcase (its record stays until Briefcase confirms the deletion; failures are
            retried, backing off from 1 minute to 1 hour).
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: files}
                  data:
                    type: object
                    required: [items, next_cursor]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/File'}}
                      next_cursor: {type: [string, 'null']}
  /api/v1/files/{file_id}:
    parameters:
      - {$ref: '#/components/parameters/FileId'}
    get:
      tags: [Files]
      operationId: getFile
      summary: One file and its Briefcase link
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderSilicon'}
        - {$ref: '#/components/parameters/TestingSecret'}
      responses:
        '200':
          description: File
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: file}
                  data: {$ref: '#/components/schemas/File'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/files/{file_id}/keep:
    parameters:
      - {$ref: '#/components/parameters/FileId'}
    post:
      tags: [Files]
      operationId: keepFile
      summary: Make a file permanent before it self-destructs (`extend file keep`)
      description: |
        The Silicon that made it. A file already permanent is 409 `not_self_destructing`; one already gone is 404.
        As built, self-destruct is Extend's own schedule (TECHNICAL.md §13), so this cancels it in Extend and leaves the
        Briefcase entry unchanged; Briefcase has no OBO endpoint for making a file permanent (TECHNICAL.md, open
        question 2).
      parameters:
        - {$ref: '#/components/parameters/TeamHeader'}
        - {$ref: '#/components/parameters/TestingSecret'}
      responses:
        '200':
          description: Now permanent
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: file}
                  data: {$ref: '#/components/schemas/File'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/files/{file_id}/content:
    parameters:
      - {$ref: '#/components/parameters/FileId'}
    get:
      tags: [Files]
      operationId: fileContent
      summary: Download a file's bytes (`extend file get`, and every `--out`)
      description: |
        The Silicon that made the file (`created_by`), or the Carbon who owns the pair it was made through, until its
        self-destruct time passes: the same check as `GET /api/v1/files/{file_id}`. The bytes are read from the file
        store as the caller, in the file's Team: Briefcase's `briefcase.files.read` over OBO in production, so
        Briefcase's own sharing applies too (local disk in development). A Carbon whose Extend login doesn't reach the
        file's Team gets `403 not_a_team_member`, "Sign in to Extend for <team> to open files made there" (1.1). `HEAD`
        answers the same headers without the body.

        One byte range is honoured: `Range: bytes=F-L`, `bytes=F-` or `bytes=-N` answers 206; a range that starts past
        the end answers 416. Several ranges, other units, malformed ranges, or L before F are ignored and the whole file
        is served. The service holds the whole file in memory while it answers (files are at most 1 GiB).

        Refusals: `404 file_not_found` for a file that is unknown, not visible to the caller, or already
        self-destructed. Briefcase's own refusals keep their codes (`403 no_access`, `404 file_not_found`,
        `429 rate_limited`, `503 service_unavailable`); for the device's Carbon, when sharing the file with them failed
        when it was made, the hint says "Ask <creator> to share it with you in Briefcase."
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderSilicon'}
        - {$ref: '#/components/parameters/TestingSecret'}
        - name: Range
          in: header
          required: false
          schema: {type: string, example: bytes=0-1023}
      responses:
        '200':
          description: The whole file
          headers:
            Content-Type: {schema: {type: string}, description: 'The type the device reported when the file was made (else the store''s)'}
            Content-Length: {schema: {type: integer}}
            Content-Disposition:
              schema: {type: string}
              description: "attachment; filename=\"<name, with non-ASCII characters, quotes and backslashes as _>\"; filename*=UTF-8''<percent-encoded name> (RFC 8187)"
              example: "attachment; filename=\"screenshot.png\"; filename*=UTF-8''screenshot.png"
            Accept-Ranges: {schema: {type: string, const: bytes}}
            Cache-Control: {schema: {type: string, const: 'private, no-store'}}
            X-Content-Type-Options: {schema: {type: string, const: nosniff}}
            Content-Security-Policy: {schema: {type: string, const: "sandbox; default-src 'none'"}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '206':
          description: The requested range, with the same headers
          headers:
            Content-Range: {schema: {type: string}, example: bytes 0-7/67}
            Content-Length: {schema: {type: integer}}
            Content-Disposition: {schema: {type: string}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Error'}
        '403': {description: 'not_a_team_member; no_access (Briefcase)', $ref: '#/components/responses/Error'}
        '404': {description: file_not_found, $ref: '#/components/responses/Error'}
        '416':
          description: 'The range starts past the end. Error envelope with code invalid_input and a hint about the Range header.'
          headers:
            Content-Range: {schema: {type: string}, example: bytes */67}
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: error}
                  data: {$ref: '#/components/schemas/Error'}
        '429': {description: rate_limited (Briefcase), $ref: '#/components/responses/Error'}
        '503': {description: service_unavailable (Briefcase), $ref: '#/components/responses/Error'}

  # ───────────────────────────── Device app ─────────────────────────────
  /api/v1/device:
    get:
      tags: [Device app]
      operationId: deviceSelf
      summary: What the Extend app shows once paired
      description: |
        The pair the credential belongs to. An app with several pairs reads it once per credential (docs/device-protocol.md
        section 2). `team` is the Team that was selected when the Carbon paired it; it authorizes nothing. `in_use` is
        set only when the session runs through this pair. 1.1 adds `instance_id` (the physical device; every pair of it
        shares one), `hardware_salt` (computer pairs only: the world's key for `hardware_key` on carried devices) and
        `first_pair` (true for the pair made by the app's first enrollment, whose Silicons get the terminal on a
        computer several Carbons paired). `in_use_indicator` is the physical device's shared banner choice, with
        `shown` as the default when absent. A 1.1 app preserves its saved local choice when a 1.0 service omits the field.

        Every device endpoint (this one, `PATCH`, `DELETE`, `/attachments/{device_id}`, `/stop`, `/enrollments`, `/connect`, `/artifacts/…`) finds the device's world from its
        credential. For a device in a test environment that is disabled, being prepared or restored, or being cleaned,
        they answer `503 testing_environment_not_ready`, not 401: the pair is kept, and the hint says the app reconnects
        by itself once the environment is open again (a clean unpairs every device in it). If the request also sends
        `X-Testing-Application-Secret` for another world, it is `401 testing_secret_invalid`.
      security:
        - deviceCredential: []
      responses:
        '200':
          description: Name, owner, who is using it, and the test environment if any
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: device_self}
                  data:
                    type: object
                    required: [device_id, name, owner, team, in_use, environment]
                    properties:
                      device_id: {$ref: '#/components/schemas/DeviceIdValue'}
                      name: {$ref: '#/components/schemas/DeviceName'}
                      owner: {$ref: '#/components/schemas/Member'}
                      team: {type: string, description: 'The Team selected when this pair was made (never null; authorizes nothing)'}
                      os: {$ref: '#/components/schemas/DeviceOs'}
                      in_use: {oneOf: [{$ref: '#/components/schemas/InUse'}, {type: 'null'}]}
                      takeover: {oneOf: [{$ref: '#/components/schemas/Takeover'}, {type: 'null'}]}
                      setup: {$ref: '#/components/schemas/Setup'}
                      environment: {oneOf: [{$ref: '#/components/schemas/TestingEnvironment'}, {type: 'null'}]}
                      instance_id: {type: string, format: uuid, description: '1.1: the physical device; every pair of it shares one'}
                      hardware_salt: {type: string, description: '1.1, computer pairs only: the same for every computer in the world'}
                      first_pair: {type: boolean, description: '1.1: made by the app''s first enrollment (the Carbon who installed Silicon Extend on the device)'}
                      in_use_indicator: {$ref: '#/components/schemas/InUseIndicator'}
        '401': {$ref: '#/components/responses/Error'}
        '503': {description: testing_environment_not_ready (the pair is kept), $ref: '#/components/responses/Error'}
    patch:
      tags: [Device app]
      operationId: updateDeviceSelf
      summary: Show or hide this physical device's in-use banner
      description: |
        Any live pair credential can change the shared physical device preference. The envelope is `device_self`;
        a bare data object is also accepted. Send `in_use_indicator: shown|hidden`. No If-Match is needed. The setting
        does not end a session, release the screen hold, hide takeover requests, or remove Stop from the app/website.
        Changed values refresh every live pair. A 1.0 service has no PATCH handler; 1.1 native apps retain their local
        choice and report that synchronization is unavailable or pending instead of treating an omitted GET field as
        an instruction to reset it.
      security:
        - deviceCredential: []
      requestBody:
        $ref: '#/components/requestBodies/DeviceIndicatorPatch'
      responses:
        '200': {$ref: '#/paths/~1api~1v1~1device/get/responses/200'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {description: testing_environment_not_ready (the pair is kept), $ref: '#/components/responses/Error'}
    delete:
      tags: [Device app]
      operationId: revokePair
      summary: Revoke pair, from the device (dangerous)
      description: |
        Removes the device from the account of the Carbon whose pair the credential is, and ends the access of every
        Silicon that Carbon gave access to (`pair_revoked`; a command in flight answers its caller `409 session_ended` at
        once). Other Carbons' pairs of the device are untouched (1.1). The device stays readable to its Carbon as a
        removed device. The app confirms with the Carbon first, naming them. There is no route yet for a host computer to revoke a device it
        carries; its Carbon removes that one on the website or with `extend device rm`.
      security:
        - deviceCredential: []
      responses:
        '204': {description: Unpaired; the credential no longer works}
        '401': {$ref: '#/components/responses/Error'}
        '503': {description: testing_environment_not_ready (the pair is kept), $ref: '#/components/responses/Error'}
  /api/v1/device/attachments/{device_id}:
    parameters:
      - {$ref: '#/components/parameters/DeviceId'}
    patch:
      tags: [Device app]
      operationId: updateAttachedDeviceIndicator
      summary: A host app shows or hides a carried device's shared in-use banner
      description: |
        Uses the computer's live pair credential. The target must be carried by that exact host pair in the same
        world and remain live after authorization is re-checked under the instance locks. Another Carbon's host pair,
        an unrelated target or a removed target gets `404 device_not_found`. The response is the target's device_self.
        The physical device preference updates every carried alias/host through attach frames without replacing a
        live driver, session or recording. The native app may save an offline choice and synchronize it later.
      security:
        - deviceCredential: []
      requestBody:
        $ref: '#/components/requestBodies/DeviceIndicatorPatch'
      responses:
        '200': {$ref: '#/paths/~1api~1v1~1device/get/responses/200'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {description: testing_environment_not_ready (the pair is kept), $ref: '#/components/responses/Error'}
  /api/v1/device/stop:
    post:
      tags: [Device app]
      operationId: deviceStop
      summary: The Carbon tapped Stop on the device
      description: |
        Same as the `stop` frame on the socket, for when the socket is down: ends the running session with
        `stopped_by_carbon` (a command in flight answers `409 session_ended` at once). A no-op when nothing runs. Client:
        `Client::device_stop`. 1.1: it acts on the physical device, from any pair's credential: the session ends
        whichever Carbon's pair it runs through, and on a computer every session on a device it carries ends too.
      security:
        - deviceCredential: []
      responses:
        '204': {description: 'Stopped, or nothing was running'}
        '401': {description: 'unauthorized: the credential is not paired', $ref: '#/components/responses/Error'}
        '503': {description: testing_environment_not_ready (the pair is kept), $ref: '#/components/responses/Error'}
  /api/v1/device/enrollments:
    post:
      tags: [Device app]
      operationId: pairWithAnotherCarbon
      summary: '"Pair with another Carbon": a paired app asks for a new pairing code (1.1)'
      description: |
        With the credential of any live pair of the device. The answer is shaped like `POST /api/v1/enrollments`; the app
        follows it the same way (`GET /api/v1/enrollments/{id}` and `/enrollments/{id}/connect`). The code it shows
        pairs the same physical device into the same world for whichever Carbon enters it on the website: a new pair,
        with its own `device_id`, credential, name, access list and lifetime (docs/device-protocol.md section 1). The
        app never names the device itself; holding a live credential is the proof, and only a Carbon can claim the code.

        No body, `{}` or `{"type": "enrollment", "data": {}}`. Limits: the 60 enrollments per hour per address of
        `POST /api/v1/enrollments`; at most 3 waiting codes per device (`429 rate_limited`, `details.retry_after_s`);
        `409 conflict` when the device already has `EXTEND_MAX_PAIRS_PER_DEVICE` pairs (8 by default): "This device is
        paired to 8 Carbons, the most Extend allows." A 1.0 service answers 404. A device paired through a computer has
        no credential, so it can't call this: its second Carbon pairs the computer and adds the device through it.
      security:
        - deviceCredential: []
      parameters:
        - {$ref: '#/components/parameters/TestingSecret'}
      responses:
        '201':
          description: Enrollment with its first code
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: enrollment}
                  data:
                    type: object
                    required: [enrollment_id, enrollment_secret, pairing_code, code_expires_at, rotates_every_s]
                    properties:
                      enrollment_id: {type: string, format: uuid}
                      enrollment_secret: {type: string, pattern: '^ees_[A-Za-z0-9_-]{43}$', description: Returned once}
                      pairing_code: {$ref: '#/components/schemas/PairingCode'}
                      code_expires_at: {type: string, format: date-time}
                      rotates_every_s: {type: integer, const: 300}
        '401': {$ref: '#/components/responses/Error'}
        '409': {description: 'conflict: the device has the most pairs Extend allows', $ref: '#/components/responses/Error'}
        '429': {description: rate_limited, $ref: '#/components/responses/Error'}
        '503': {description: testing_environment_not_ready (the pair is kept), $ref: '#/components/responses/Error'}
  /api/v1/device/connect:
    get:
      tags: [Device app]
      operationId: deviceSocket
      summary: The paired device's WebSocket to Extend
      description: |
        Upgrade to WebSocket with `Authorization: Extend-Device <device_credential>`. Flat JSON frames
        `{"type": ..., <fields>}`; every frame and field is in docs/device-protocol.md (Rust: extend-protocol frames.rs). Ping every 15 s; offline after 45 s
        without a pong. One connection per pair (1.1): an app with several pairs opens one for each credential. A new
        connection for a pair replaces the old one, which gets `superseded`; when the old one had answered a ping in
        the last 30 s, the pair's activity log records `connection_replaced`. A credential rotated by a `credential`
        frame but not yet confirmed also connects, and connecting with it confirms it. Close codes: 4401 credential invalid or unpaired, 4409 superseded by a newer connection,
        4426 app too old (upgrade required), 4503 the device's test environment closed (disabled, or waiting for
        Honeycomb's readiness; reason "test environment disabled; still paired, reconnect later"): the pair is kept and
        the app reconnects with its usual backoff. The handshake itself answers 503 `testing_environment_not_ready` for
        such an environment.
      security:
        - deviceCredential: []
      responses:
        '101': {description: Switching protocols}
        '401': {$ref: '#/components/responses/Error'}
        '426': {$ref: '#/components/responses/Error'}
        '503': {description: testing_environment_not_ready (the pair is kept; reconnect with backoff), $ref: '#/components/responses/Error'}
  /api/v1/device/artifacts/{upload_id}:
    put:
      tags: [Device app]
      operationId: uploadArtifact
      summary: Upload a file a command produced
      description: |
        `upload_id` comes with the command. Single use, valid until the command's deadline, at most 1 GiB. Extend
        streams it to Briefcase and answers once Briefcase has it.
      security:
        - deviceCredential: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: Content-Type
          in: header
          required: true
          schema: {type: string, example: image/png}
        - name: X-Content-SHA256
          in: header
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
        - name: X-File-Name
          in: header
          required: true
          schema: {type: string, maxLength: 255}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '201': {description: Stored}
        '404': {description: 'Unknown, used or expired upload id'}
        '413': {description: Larger than 1 GiB}
        '422': {description: Digest does not match the bytes}

  # ───────────────────────────── Testing ─────────────────────────────
  /api/v1/testing-environment:
    get:
      tags: [Testing]
      operationId: currentTestingEnvironment
      summary: The test environment the secret selects (for the banner)
      description: |
        `extend config test add` checks with this that a secret belongs to the environment id it is saved under. Test
        access opens only once Honeycomb has confirmed every service of the environment is ready: Extend takes Silicon
        IAM accepting the secret as that confirmation (IAM refuses it until Honeycomb's activate phase), or Honeycomb's
        participant `activate` instruction. Until then the answer is `503 testing_environment_not_ready`, saying why
        and what to wait for.
      security: []
      parameters:
        - name: X-Testing-Application-Secret
          in: header
          required: true
          schema: {$ref: '#/components/schemas/AppSecret'}
      responses:
        '200':
          description: Environment
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: testing_environment}
                  data: {$ref: '#/components/schemas/TestingEnvironment'}
        '400': {description: 'test_only: no secret was sent', $ref: '#/components/responses/Error'}
        '401': {description: testing_secret_invalid, $ref: '#/components/responses/Error'}
        '503': {description: testing_environment_not_ready, $ref: '#/components/responses/Error'}
  /internal/honeycomb/organizations/{org_id}/testing-environments/{environment_id}/operations/{operation_id}:
    parameters:
      - {name: org_id, in: path, required: true, schema: {type: string}}
      - {name: environment_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: operation_id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [Testing]
      operationId: applyHoneycombLifecycle
      summary: Apply a Honeycomb lifecycle instruction
      description: |
        Plain JSON, no envelope, matching the other services. Operations on one environment run one at a time. Before
        any effect a `pending` receipt is stored (with the environment's new revision); it becomes `completed` or
        `failed` (`error` is "<code>: <message>"), so a crash mid-operation leaves a receipt to retry.

        Replays: the identical instruction returns the stored `completed` receipt, whatever the state; a `pending` or
        `failed` one is finished again only while its operation is the environment's latest. A retry of an operation a
        later one superseded is `409 conflict` ("… was superseded by a later operation, so it won't run now."). A
        different instruction under the same `operation_id` is 409.

        Ordering: `environment_revision` must be newer than or equal to the environment's; only an older one is stale
        (409 "Stale instruction: revision N is older than …"). Only `clean` advances `generation` and a new clean must
        advance it; only `rotate-key` advances `key_version` and a new rotate-key must advance it; an older generation or
        key version is 409. `app_id` must be Extend's (400 otherwise).

        What each action does, and the receipt's `target_state`:
        - `prepare` (or an `import` that arrives first): creates the schema and takes one of the 10 active slots;
          `preparing`. Test access opens only once Honeycomb confirms readiness (IAM accepts the secret, or `activate`).
        - `activate`: `ready`. Honeycomb itself confirms readiness only to IAM today; this participant action is an
          Extend extension (TECHNICAL.md open questions).
        - `disable`: `disabled`. Access is blocked at once, every running session ends (`environment_disabled`), and
          every device socket closes with 4503; no device is unpaired, and the data is kept.
        - `restore`: from `disabled`, takes a free slot and goes back to `preparing` (so access waits for readiness
          again). Can't undo a clean.
        - `clean`: blocks access, ends sessions, unpairs every device, deletes waiting pairing codes, waits for
          requests and background work admitted before it, clears the data, then returns to the state it had. A
          disabled environment stays `disabled` and never enters `cleaning`. IAM event ids and aggregate versions are
          kept.
        - `rotate-key`, `import`, `refresh-import`: acknowledged; the state is unchanged.
        - `retire-applications`: when `retired_apps` names Extend, clears Extend's data like a clean and `disabled`;
          otherwise acknowledged.
        - `purge`: ends everything, drops the schema, forgets the environment's secrets and pairing codes; `removed`.
          A purge of an id Extend never saw records it as removed. A removed environment accepts only `purge` (harmless
          again); anything else, even the retry of an operation accepted before the purge, is 409 "… was permanently
          removed; it can't be …" with the hint to create a new environment in Honeycomb.

        Other refusals (409 with a hint): an instruction other than `prepare`, `import` or `purge` for an environment
        Extend was never prepared for; `prepare` or `activate` of a disabled environment (send `restore`); anything but
        a retry of the pending clean, a new clean or a purge while a clean is unfinished; an environment of another
        team. At most 10 environments are active (`preparing`, `ready`, `cleaning`) across the deployment: a `prepare`
        or `restore` with no free slot is `409 test_environment_limit`, leaves a `failed` receipt, and succeeds when
        the identical instruction is retried after a slot frees up.
      security:
        - honeycombService: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HoneycombOperation'}
      responses:
        '200':
          description: Receipt (new or replayed)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HoneycombReceipt'}
        '400': {description: 'Invalid instruction, an application other than Extend, or a path/body mismatch'}
        '401': {description: Missing or invalid service credential}
        '409': {description: 'Stale revision, generation or key version; a superseded or conflicting retry; a removed environment; no free slot of the 10 active environments (test_environment_limit); or an incompatible transition'}
        '500': {description: Failed; inspect the receipt and retry the identical instruction}
    get:
      tags: [Testing]
      operationId: getHoneycombReceipt
      summary: Read a lifecycle receipt
      security:
        - honeycombService: []
      responses:
        '200':
          description: Receipt, with no secrets
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HoneycombReceipt'}
        '401': {description: Missing or invalid service credential}
        '404': {description: Unknown operation}

  # ───────────────────────────── IAM webhooks ─────────────────────────────
  /webhook/:
    post:
      tags: [IAM webhooks]
      operationId: iamWebhook
      summary: Signed events from Silicon IAM
      description: |
        Verified with the official IAM client over the exact raw body (1 MiB limit, five-minute timestamp window,
        key version from the header) before anything else is trusted. Test deliveries are routed to their environment
        after verification (IAM's test webhook key digest is stored, so routing survives a restart), and only while
        that environment is `ready` or `preparing`; for any other environment (cleaning, disabled, removed, unknown) the
        delivery is acknowledged with 204 and dropped, and never recreates its data.

        De-duplicated on event id. Events about one aggregate (`aggregate: {type, id, version}`, in a plain event or a
        signed test envelope) apply in order: one whose version is not newer than the newest applied is acknowledged
        and dropped. An event is recorded as applied only after its effects succeed, in the same transaction; if
        applying fails, the answer is 5xx and IAM's retry applies it again. Extend confirms with IAM (the Silicon's live
        authorization, then membership) before ending access; a removal the event reports is used only when IAM can't
        answer. The raw body and any `testing_key` are never stored.
        Handled: session revoked or logged out, membership removed, member deleted, application consent revoked,
        test environment cleaned. (IAM sends applications no logout events today; see TECHNICAL.md section 9.)
        1.1: a Silicon that left a Team loses its grants in that Team only, and its sessions there end. A Carbon who left
        a Team loses the grants they gave in that Team, on every pair, and those sessions end (`left_team`); their devices
        stay paired and their grants in other Teams stay. An event clears Extend's cached membership answers for the
        members it names.
      security: []
      parameters:
        - {name: X-Silicon-IAM-Event-ID, in: header, required: true, schema: {type: string}}
        - {name: X-Silicon-IAM-Timestamp, in: header, required: true, schema: {type: string, pattern: '^[0-9]+$'}}
        - {name: X-Silicon-IAM-Key-Version, in: header, required: true, schema: {type: string, pattern: '^[1-9][0-9]*$'}}
        - {name: X-Silicon-IAM-Signature, in: header, required: true, schema: {type: string, pattern: '^v1=[0-9a-f]{64}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true, description: 'IAM WebhookEvent, or a signed test envelope'}
      responses:
        '204': {description: 'Applied; or a duplicate, an out-of-order event, or a delivery for a test environment that isn''t open, acknowledged and dropped'}
        '401': {description: Signature invalid}
        '500': {description: 'Applying failed; nothing was recorded, so IAM''s retry applies it again'}

  # ───────────────────────────── Operations ─────────────────────────────
  /api/v1/reports:
    post:
      tags: [Operations]
      operationId: reportBug
      summary: Report a bug, optionally with a PR that fixes it (`extend report`)
      description: Stored, then emailed through Postmark to the bug list. Simulated in a test environment. 10 reports per member per hour.
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderOptional'}
        - {$ref: '#/components/parameters/TestingSecret'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: {const: report}
                data:
                  type: object
                  additionalProperties: false
                  required: [message, client_version]
                  properties:
                    message: {type: string, minLength: 1, maxLength: 60000}
                    pr: {type: [string, 'null'], format: uri}
                    client_version: {type: string, maxLength: 100}
                    context:
                      type: object
                      description: Optional; the CLI attaches OS, CLI version, last command, session id and request ids
                      additionalProperties: true
      responses:
        '202':
          description: Stored; email queued, sent or simulated
          content:
            application/json:
              schema:
                type: object
                required: [type, data]
                properties:
                  type: {const: report}
                  data:
                    type: object
                    required: [report_id, notification, repository_url]
                    properties:
                      report_id: {type: string, format: uuid}
                      notification: {type: string, enum: [queued, sent, simulated]}
                      repository_url: {type: string, format: uri}
        '429': {$ref: '#/components/responses/Error'}
  /api/v1/telemetry:
    post:
      tags: [Operations]
      operationId: telemetry
      summary: Forward a telemetry event to Space Station
      description: |
        So the CLI and apps never hold the Space Station ingest key. `X-Extend-Telemetry: off` drops it, and on
        any other route it keeps the service from recording that request (for example a command's event).
        Never accepts typed text, screen contents, tokens, codes or secrets.
      parameters:
        - {$ref: '#/components/parameters/TeamHeaderOptional'}
        - {$ref: '#/components/parameters/TestingSecret'}
        - {name: X-Extend-Telemetry, in: header, schema: {type: string, enum: ['on', 'off']}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: {const: telemetry}
                data:
                  type: object
                  additionalProperties: false
                  required: [source, event, step, success, duration_ms]
                  properties:
                    source: {type: string, enum: [cli, client, app, web]}
                    event: {type: string, maxLength: 64, example: command}
                    step: {type: string, maxLength: 128, example: session.command.relay}
                    success: {type: boolean}
                    duration_ms: {type: integer, minimum: 0}
                    error_code: {type: [string, 'null'], maxLength: 64}
                    command: {type: [string, 'null'], maxLength: 64}
                    device_os: {oneOf: [{$ref: '#/components/schemas/DeviceOs'}, {type: 'null'}]}
                    session_id: {oneOf: [{$ref: '#/components/schemas/SessionIdValue'}, {type: 'null'}]}
                    request_id: {type: [string, 'null']}
                    client_version: {type: string, maxLength: 32}
      responses:
        '204': {description: Accepted or dropped because telemetry is off}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Extend application access token (oat_), from /api/v1/auth/login
    enrollmentSecret:
      type: http
      scheme: bearer
      bearerFormat: 'Enrollment secret (ees_). Sent as "Authorization: Extend-Enrollment <secret>".'
    deviceCredential:
      type: http
      scheme: bearer
      bearerFormat: 'Device credential (edc_). Sent as "Authorization: Extend-Device <credential>".'
    honeycombService:
      type: http
      scheme: bearer
      description: Honeycomb's service credential. Independent of any test session.

  parameters:
    TeamHeader:
      name: X-Org-ID
      in: header
      required: true
      description: Team handle (IAM's wire name). Must be one of the member's selected, active teams.
      schema: {type: string, minLength: 1, maxLength: 128}
      example: acme
    TeamHeaderOptional:
      name: X-Org-ID
      in: header
      required: false
      description: 'Optional. On a Carbon''s own-device routes (1.1) it filters nothing; when sent it must be a Team the login reaches, and it is the default Team for grants.'
      schema: {type: string, minLength: 1, maxLength: 128}
    TeamHeaderSilicon:
      name: X-Org-ID
      in: header
      required: false
      description: 'Required for a Silicon: the Team it acts in. Optional for a Carbon (1.1): their own devices, sessions and files are answered in every Team.'
      schema: {type: string, minLength: 1, maxLength: 128}
    TeamQuery:
      name: team
      in: query
      required: false
      description: 'The Silicon''s Team the grant is in (1.1). For a grant it defaults to X-Org-ID; for a revoke, absent means every Team.'
      schema: {type: string, minLength: 1, maxLength: 128}
    TestingSecret:
      name: X-Testing-Application-Secret
      in: header
      required: false
      description: The test application's app_secret. Selects that test environment. Omit for production. Never the Honeycomb testing_key.
      schema: {$ref: '#/components/schemas/AppSecret'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, pattern: '^[!-~]{8,255}$'}
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The device version from its ETag. Stale is 412. Without it the change applies to the current version.
      schema: {type: string, pattern: '^"?[1-9][0-9]*"?$'}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/DeviceIdValue'}
    SessionId:
      name: session_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/SessionIdValue'}
    SiliconIdPath:
      name: silicon_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/SiliconId'}
    EnrollmentId:
      name: enrollment_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    FileId:
      name: file_id
      in: path
      required: true
      description: Briefcase entry id
      schema: {type: string, format: uuid}
    WakeId:
      name: wake_id
      in: path
      required: true
      schema: {type: string, format: uuid}

  headers:
    Deprecation:
      description: 'On a deprecated API major only: when it was deprecated, as @<unix seconds> (RFC 9745)'
      schema: {type: string, pattern: '^@[0-9]+$', example: '@1790000000'}
    Sunset:
      description: 'On a deprecated API major only: the soonest it can be sunset, as an HTTP-date (RFC 8594)'
      schema: {type: string, example: 'Thu, 01 Oct 2026 00:00:00 GMT'}

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            required: [type, data]
            properties:
              type: {const: error}
              data: {$ref: '#/components/schemas/Error'}
          example:
            type: error
            data:
              code: device_in_use
              message: 'Device 7c1e09ab (Saket''s Pixel) is being used by si:chef in session a3f since 2026-09-26T09:58:00Z. Only one Silicon can use a device at a time.'
              hint: 'Ask for it with: extend request send 7c1e09ab --reason "<why, up to 300 characters>"'
              docs_url: https://extend.teamofsilicons.com/docs/cli#error-device_in_use
              request_id: 01926f41-0a1b-7c2d-8e3f-4a5b6c7d8e9f
              details: {in_use: {silicon_id: 'si:chef', session_id: a3f, since: '2026-09-26T09:58:00.000Z'}}
          # When the Silicon using the device is on another side (another Team, or another Carbon's pair), 1.1 names no
          # one: "Device 7c1e09ab (Living room TV) is in use. Only one Silicon can use a device at a time.", hint
          # 'Ask for it: extend --team labs request send 7c1e09ab --reason "..."', details {in_use: {hidden: true}}.

  requestBodies:
    DeviceIndicatorPatch:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                required: [type, data]
                properties:
                  type: {const: device_self}
                  data: {$ref: '#/components/schemas/DeviceSelfPatch'}
              - {$ref: '#/components/schemas/DeviceSelfPatch'}
  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Stable. The full list is in cli.yaml under errors.
          example: device_in_use
        message: {type: string, description: 'What happened and why, in full'}
        hint: {type: [string, 'null'], description: 'What to do next, often an exact command'}
        docs_url: {type: [string, 'null'], format: uri}
        request_id: {type: string}
        details: {type: object, additionalProperties: true}

    AppSecret: {type: string, pattern: '^ask_[A-Za-z0-9_-]{43}$', writeOnly: true}
    PairingCode: {type: string, pattern: '^[0-9A-F]{6}$', example: 4F9C2A, description: 6 hexadecimal characters; rotates every 300 s; works once}
    PairingCodeInput: {type: string, pattern: '^[0-9A-Fa-f]{6}$', example: 4f9c2a, description: Case-insensitive}
    DeviceIdValue: {type: string, pattern: '^[0-9a-f]{8}$', example: 7c1e09ab}
    SessionIdValue: {type: string, pattern: '^[0-9a-f]{3,}$', example: a3f, description: '3 hexadecimal characters, growing to 4 and more once every shorter id is used; never reused'}
    InUseIndicator:
      type: string
      enum: [shown, hidden]
      default: shown
      description: |
        1.1: shared by every pair of a physical device. Shown displays the in-use banner/notification for 10 seconds
        per session (the desktop icon stays changed until the session ends); hidden suppresses those announcements
        and icon changes. Takeover requests remain until answered and Stop remains in the app and website. Android's
        quiet running notification, Apple's Automation Running banner and test-environment disclosure are separate.
        Old responses omit this field; readers default to shown unless preserving an explicit saved native choice.
        A future unknown value is read as shown; writes accept only shown or hidden.
    DeviceSelfPatch:
      type: object
      required: [in_use_indicator]
      properties:
        in_use_indicator: {$ref: '#/components/schemas/InUseIndicator'}
    CarbonId: {type: string, pattern: '^c:', example: 'c:alice'}
    SiliconId: {type: string, pattern: '^si:', example: 'si:chef'}
    DeviceName: {type: string, minLength: 1, maxLength: 64, example: Saket's Pixel}
    Visibility:
      type: string
      enum: [team, personal]
      deprecated: true
      description: 'Deprecated in 1.1: a device is visible only to the Carbons who paired it, so every device reads personal. A value sent is accepted and ignored.'
    PairTtlDays: {type: integer, minimum: 1, maximum: 30, default: 14}
    DeviceOs:
      type: string
      enum: [android, android_tv, macos, windows, linux, ios, ipados, tvos, samsung_tv, lg_tv]
      description: android_tv covers Android TV, Google TV and Fire OS
    Capability:
      type: string
      enum: [screen.read, screen.capture, screen.record, input.touch, input.pointer, input.text, input.keyboard, input.remote,
        nav.system, apps.launch, apps.list, apps.install, alerts, clipboard, logs, replay, takeover, notifications, adb, terminal,
        display, links]
    FileKind: {type: string, enum: [screenshot, recording, log, replay_script, diff, other]}

    Member:
      type: object
      required: [type, id]
      properties:
        type: {type: string, enum: [carbon, silicon]}
        id: {type: string, example: 'c:alice'}
        display_name: {type: [string, 'null']}

    AuthSession:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, member, teams]
      properties:
        access_token: {type: string, description: Starts oat_}
        refresh_token: {type: string, description: Starts ort_}
        token_type: {const: Bearer}
        expires_in: {type: integer, minimum: 1}
        member: {$ref: '#/components/schemas/Member'}
        teams: {type: array, minItems: 1, items: {type: string}}
        testing_environment: {oneOf: [{$ref: '#/components/schemas/TestingEnvironment'}, {type: 'null'}]}

    InUse:
      type: object
      required: [silicon_id, session_id, since]
      description: 'Only on the viewer''s own side (1.1): the owner sees it when the session runs through their pair; a Silicon when the Silicon using it is on its side.'
      properties:
        silicon_id: {$ref: '#/components/schemas/SiliconId'}
        session_id: {$ref: '#/components/schemas/SessionIdValue'}
        since: {type: string, format: date-time}
        paused: {type: boolean, default: false}
        team: {type: string, description: '1.1, owner views only: the Team the Silicon uses the device in'}

    EndReason:
      type: string
      description: Why a session ended, or (as `removed_reason`) why a pair ended
      enum: [ended_by_silicon, idle_timeout, stopped_by_carbon, access_removed, device_removed, pair_revoked, pair_expired,
        silicon_logged_out, left_team, device_offline, environment_disabled, environment_cleaned]

    Device:
      type: object
      required: [device_id, name, os, kind, owner, visibility, online, state]
      description: |
        One Carbon's pair of a device. A removed device (readable only by the Carbon who paired it) has `removed_at` and
        `removed_reason`, `online` false, and no `in_use`, `pair_expires_at` or `days_left`. 1.1: `team` is absent in
        the owner's view and is the Silicon's own Team in a Silicon's view; `visibility` is always `personal`. Fields
        marked "owner" appear only in the view of the Carbon who paired this pair.
      properties:
        device_id: {$ref: '#/components/schemas/DeviceIdValue'}
        name: {$ref: '#/components/schemas/DeviceName'}
        os: {$ref: '#/components/schemas/DeviceOs'}
        os_version: {type: [string, 'null']}
        model: {type: [string, 'null']}
        kind: {type: string, enum: [phone, tablet, tv, computer]}
        owner: {$ref: '#/components/schemas/Member'}
        team: {type: string, description: 'Silicon views: the Team it uses the device in. Absent for the owner (1.1).'}
        visibility: {$ref: '#/components/schemas/Visibility'}
        host_device_id: {oneOf: [{$ref: '#/components/schemas/DeviceIdValue'}, {type: 'null'}], description: Set for devices paired through a computer}
        state: {type: string, enum: [setup, ready], description: 'setup: its own setup steps are not finished yet'}
        online: {type: boolean}
        last_seen_at: {type: [string, 'null'], format: date-time}
        in_use: {oneOf: [{$ref: '#/components/schemas/InUse'}, {type: 'null'}]}
        last_used_at: {type: [string, 'null'], format: date-time, description: 'Owner: when a Silicon last used this pair (1.1: not in Silicon views)'}
        paired_at: {type: string, format: date-time}
        pair_ttl_days: {$ref: '#/components/schemas/PairTtlDays'}
        pair_expires_at: {type: string, format: date-time, description: 'The pair ends after pair_ttl_days without activity on the device: a session or command through any Carbon''s pair keeps every pair of it alive (1.1)'}
        days_left: {type: integer, minimum: 0}
        access_count: {type: integer, minimum: 0, description: 'Grants on this pair: every Team''s for the owner, the Silicon''s own Team''s for a Silicon (1.1)'}
        app_version: {type: [string, 'null']}
        version: {type: integer, minimum: 1}
        removed_at: {type: string, format: date-time, description: 'Removed devices only: when the pair ended'}
        removed_reason:
          allOf: [{$ref: '#/components/schemas/EndReason'}]
          description: 'Removed devices only: why the pair ended (device_removed, pair_revoked, pair_expired, left_team, environment_cleaned…)'
        engine_version: {type: string, description: '1.1: the device engine''s version on the device (for a carried device, on its computer)'}
        agent_device_version: {type: string, deprecated: true, description: 'The same value under its 1.0 name, kept for API v1 readers'}
        awake:
          type: boolean
          description: |
            1.1: whether the device is awake (screen on and unlocked; a computer awake and unlocked; a TV on). Absent while
            it is offline, or while an online device hasn't said (apps older than 1.1 never do). Never a gate.
        sleep_state: {$ref: '#/components/schemas/SleepState'}
        last_sleep_state: {allOf: [{$ref: '#/components/schemas/SleepState'}], description: '1.1: an offline device''s last report, when it was not awake'}
        awake_changed_at: {type: string, format: date-time, description: '1.1, owner: when awake last changed'}
        wake_detectable: {type: boolean, description: '1.1: whether Extend can tell when it wakes (false for iPhone, iPad and apps older than 1.1)'}
        in_use_by_other: {type: boolean, description: '1.1: a Silicon the viewer can''t see (another side) is using it, or for a computer a device it carries. `in_use` is then absent. Left out when false.'}
        in_use_by_other_carried: {type: boolean, description: '1.1, owner views of a computer: what is busy is a carried device the viewer didn''t pair. A remote Stop can''t end it; the computer''s own Stop can. Left out when false.'}
        open_wake_requests: {type: integer, minimum: 0, description: '1.1: open wake requests the viewer may see (every Team''s on the owner''s pair; a Silicon''s own)'}
        wake_requests: {type: array, items: {$ref: '#/components/schemas/WakeRequest'}, description: '1.1, single reads: those open requests'}
        wake_muted: {type: boolean, description: '1.1, owner: wake requests are turned off for this pair'}
        in_use_indicator: {$ref: '#/components/schemas/InUseIndicator'}
        paired_by_others: {type: boolean, description: '1.1, owner: another Carbon also paired this device. Never says who.'}
        same_device: {type: array, items: {$ref: '#/components/schemas/DeviceIdValue'}, description: '1.1, Silicon views: other Carbons'' pairs of this same physical device that the Silicon has access to in the same Team'}

    Setup:
      type: object
      required: [state, steps]
      properties:
        state: {type: string, enum: [in_progress, needs_carbon, complete]}
        steps:
          type: array
          items:
            type: object
            required: [key, title, status]
            properties:
              key: {type: string, example: wireless_debugging, description: 'Stable; what `POST .../setup/retry` names. 1.1 adds duplicate_device and recognising for a carried device'}
              title: {type: string, example: Turn on wireless debugging}
              status: {type: string, enum: [todo, in_progress, needs_carbon, done, failed]}
              help: {type: [string, 'null'], description: Where to find it on this device}
              input: {type: [string, 'null'], enum: [code, null], description: 'What the Carbon enters on the website for this step: "code" for the PIN an Apple TV shows'}
              error:
                type: [string, 'null']
                description: |
                  Why it failed, in one or two sentences for the Carbon: what is wrong and what to do ("The iPhone is locked or
                  not connected by cable. Unlock it and keep it plugged in."). Never environment variables, file paths,
                  build commands, exit codes or stack traces: those are in the app's log.

    EnrollmentState:
      oneOf:
        - type: object
          required: [state, pairing_code, code_expires_at]
          properties:
            state: {const: waiting}
            pairing_code: {$ref: '#/components/schemas/PairingCode'}
            code_expires_at: {type: string, format: date-time}
        - type: object
          required: [state, device_id, device_credential]
          properties:
            state: {const: paired}
            device_id: {$ref: '#/components/schemas/DeviceIdValue'}
            device_credential: {type: string, pattern: '^edc_[A-Za-z0-9_-]{43}$', description: Returned once}
            environment: {oneOf: [{$ref: '#/components/schemas/TestingEnvironment'}, {type: 'null'}]}

    AccessGrant:
      type: object
      required: [device_id, silicon_id, granted_by, granted_at]
      properties:
        device_id: {$ref: '#/components/schemas/DeviceIdValue'}
        silicon_id: {$ref: '#/components/schemas/SiliconId'}
        granted_by: {$ref: '#/components/schemas/CarbonId'}
        granted_at: {type: string, format: date-time}
        last_used_at: {type: [string, 'null'], format: date-time}
        team: {type: string, description: '1.1: the Silicon''s Team the grant is in. A Silicon may have one grant per Team.'}
        wake_muted: {type: boolean, description: '1.1: the owner turned this Silicon''s wake requests off in this Team'}

    Session:
      type: object
      required: [session_id, device_id, silicon_id, state, started_at, last_command_at, idle_ends_at, ended_at, end_reason]
      properties:
        session_id: {$ref: '#/components/schemas/SessionIdValue'}
        device_id: {$ref: '#/components/schemas/DeviceIdValue'}
        silicon_id: {$ref: '#/components/schemas/SiliconId'}
        state: {type: string, enum: [active, paused, ended]}
        started_at: {type: string, format: date-time}
        last_command_at: {type: [string, 'null'], format: date-time}
        idle_ends_at: {type: [string, 'null'], format: date-time, description: Null once ended}
        ended_at: {type: [string, 'null'], format: date-time}
        end_reason:
          type: [string, 'null']
          enum: [ended_by_silicon, idle_timeout, stopped_by_carbon, access_removed, device_removed, pair_revoked, pair_expired,
            silicon_logged_out, left_team, device_offline, environment_disabled, environment_cleaned, null]
        command_count: {type: integer, minimum: 0}
        team: {type: string, description: '1.1: the Team the Silicon uses the device in'}

    Takeover:
      type: object
      required: [takeover_id, session_id, reason, started_at, expires_at]
      properties:
        takeover_id: {type: string, format: uuid}
        session_id: {$ref: '#/components/schemas/SessionIdValue'}
        reason: {type: string, maxLength: 300}
        started_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, description: started_at + 30 minutes; the session ends then}

    CommandResult:
      type: object
      required: [command_id, session_id, command, ok, output, files, error, started_at, duration_ms, idle_ends_at]
      properties:
        command_id: {type: string, format: uuid}
        session_id: {$ref: '#/components/schemas/SessionIdValue'}
        command: {type: string}
        ok: {type: boolean}
        output: {description: 'The device engine''s structured result for this command (for snapshot, the node tree and refs)'}
        text: {type: [string, 'null'], description: 'The device engine''s plain-text rendering, what the CLI prints without --json'}
        files: {type: array, items: {$ref: '#/components/schemas/File'}}
        error:
          oneOf:
            - type: 'null'
            - type: object
              required: [code, message]
              properties:
                code: {type: string, example: wait_target_absent}
                message: {type: string}
                details: {type: object, additionalProperties: true}
        started_at: {type: string, format: date-time}
        duration_ms: {type: integer}
        idle_ends_at: {type: string, format: date-time}
        warnings:
          type: array
          items: {type: string}
          default: []
          description: |
            What went wrong around the command without failing it, one entry per problem, each saying what happened,
            why and what to do: chiefly a file the device made that Extend couldn't store in Briefcase, share with the
            device's Carbon, or record. The service always sends it (empty when all went well); older services leave it
            out, so read a missing one as empty. `ok` does not change because of a warning.
          example: ['screenshot.png was not stored: Saket''s Pixel made it but never uploaded it (the upload failed or was cut off). Run the command again; if it keeps happening, report it with `extend report`.']

    File:
      type: object
      required: [file_id, name, kind, content_type, size_bytes, url, self_destruct_at, permanent]
      properties:
        file_id: {type: string, format: uuid, description: Briefcase entry id}
        name: {type: string, description: 'The name the device gave the file. In Briefcase the file has its own unique name (for example screenshot-20260926-153307-2228fc1d.png), which `url` uses.'}
        kind: {$ref: '#/components/schemas/FileKind'}
        content_type: {type: string}
        size_bytes: {type: integer}
        url: {type: string, format: uri, description: Briefcase permanent URL; opens only for members with access}
        self_destruct_at: {type: [string, 'null'], format: date-time}
        permanent: {type: boolean}
        session_id: {$ref: '#/components/schemas/SessionIdValue'}
        device_id: {$ref: '#/components/schemas/DeviceIdValue'}
        command_id: {type: string, format: uuid}
        created_by: {$ref: '#/components/schemas/SiliconId'}
        shared_with: {allOf: [{$ref: '#/components/schemas/CarbonId'}], description: 'The Carbon who gave the Silicon access (the owner of the pair it used)'}
        created_at: {type: string, format: date-time}
        team: {type: string, description: '1.1: the Team the file was made in (the session''s Team); opening it needs a login for that Team'}

    Request:
      type: object
      required: [request_id, device_id, from, to, reason, created_at, delivery]
      properties:
        request_id: {type: string, format: uuid}
        device_id: {allOf: [{$ref: '#/components/schemas/DeviceIdValue'}], description: 'The viewer''s own id for the device (the Carbon a request was routed to sees their own pair''s id)'}
        from: {type: string, description: 'The requesting Silicon. (REQUEST_FROM_HIDDEN, "a Silicon another Carbon gave access to", only when from_hidden; a 1.1.0 service never hides it.)'}
        to: {type: string, description: 'The Silicon using the device (routed_to holder), or, for the requester''s side of a request routed to a Carbon, "the Carbon who gave access to the Silicon using it" (to_hidden). The Carbon it was routed to sees their own id.'}
        session_id: {allOf: [{$ref: '#/components/schemas/SessionIdValue'}], description: 'The session the requester asked for; never shown to the requester''s side of a routed request'}
        reason: {type: string, maxLength: 1000, description: 'Exactly as sent, surrounding whitespace included'}
        created_at: {type: string, format: date-time}
        delivery: {type: string, enum: [pending, delivered, failed]}
        last_error:
          type: string
          description: 'While pending, or once failed: why the last delivery through Ting failed, and what to do. Left out once delivered.'
        team: {type: string, description: '1.1: the requesting Silicon''s Team; shown to the requester''s side and to that Silicon''s own Carbon'}
        routed_to: {type: string, enum: [holder, carbon], description: '1.1: to the Silicon using the device, or to the Carbon who gave it access'}
        to_hidden: {type: boolean, description: '1.1: `to` is the hidden text; left out when false'}
        from_hidden: {type: boolean, description: '1.1: `from` is the hidden text; left out when false. Never set by a 1.1.0 service.'}
    RequestPage:
      type: object
      required: [type, data]
      properties:
        type: {const: requests}
        data:
          type: object
          required: [items, next_cursor]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Request'}}
            next_cursor: {type: [string, 'null']}

    ActivityEntry:
      type: object
      required: [id, at, actor, action]
      properties:
        id: {type: string, format: uuid}
        at: {type: string, format: date-time}
        actor: {$ref: '#/components/schemas/Member'}
        action:
          type: string
          example: click
          examples: [paired, renamed, access_granted, access_revoked, session_started, session_ended, command, takeover_started,
            takeover_released, stopped, request_sent, request_failed, pair_revoked, removed, pair_expired,
            another_carbon_paired, request_received, device_linked, duplicate_device, connection_replaced,
            wake_requested, wake_refreshed, woken, woke_without_input, wake_confirmed, wake_declined, wake_cancelled,
            wake_expired, wake_withdrawn, wake_muted, wake_unmuted]
          description: |
            A command name, or a device event. 1.1 adds: `another_carbon_paired` (another Carbon paired this device, `{}`,
            never naming them); `paired` with `{"with_existing_pairs": true}`; `request_received` (a request routed to
            this Carbon, on their pair); `device_linked` and `duplicate_device` (`{"kind": "same_carbon" |
            "other_computer"}`) for carried devices; `connection_replaced` (`{"while_in_use_by_other": bool}`); the wake
            events; and `session_ended` by `extend` with `{"stopped_by": "another_carbon"}`.
        session_id: {oneOf: [{$ref: '#/components/schemas/SessionIdValue'}, {type: 'null'}]}
        command: {type: [string, 'null']}
        args: {type: [array, "null"], items: {type: string}, description: Redacted}
        outcome: {type: [string, 'null'], enum: [ok, failed, timeout, unknown, null]}
        files: {type: array, items: {type: string, format: uuid}}
        details:
          type: object
          additionalProperties: true
          description: 'For a command: `warnings` when the result had any, `error` (for example session_ended with outcome unknown). For request_failed: {request_id, from, to, error}. Never another side''s Silicon, Carbon, Team or session (1.1).'
        team: {type: string, description: '1.1: the acting Silicon''s Team; absent for Carbon and device events'}

    TeamSilicon:
      type: object
      required: [id]
      properties:
        id: {$ref: '#/components/schemas/SiliconId'}
        display_name: {type: [string, 'null']}
        team: {type: string, description: '1.1, with team=any: the Team it was listed from'}
    TeamReach:
      type: object
      required: [team, ok]
      description: Whether a Team's directory could be read, for lists across Teams (1.1)
      properties:
        team: {type: string}
        ok: {type: boolean}
        error: {allOf: [{$ref: '#/components/schemas/Error'}], description: 'Why not, when ok is false'}

    DeviceStopped:
      type: object
      required: [device_id, stopped_at, in_use_by_other]
      description: 'A Stop ended a session that ran through another Carbon''s pair of the device, so the Silicon isn''t named (1.1)'
      properties:
        device_id: {$ref: '#/components/schemas/DeviceIdValue'}
        stopped_at: {type: string, format: date-time}
        in_use_by_other: {type: boolean, const: true}

    SetupRetryInput:
      type: object
      additionalProperties: false
      description: 'Contract A (1.1): the step to run again, or {} for every failed step'
      properties:
        step: {type: string, example: wireless_debugging, description: A setup step's key}
    RetryResult:
      type: object
      required: [retrying]
      properties:
        retrying: {type: array, items: {type: string}, description: The keys of the steps the device was asked to run again}

    SleepState:
      type: string
      enum: [screen_off, locked, asleep, standby, other_session]
      description: |
        1.1: why an online device isn't awake. Shown as "screen off", "locked", "asleep", "standby" and "another account".
        Read a value you don't know as "not awake": later versions may add some.
    HostDevice:
      type: object
      required: [device_id, name, online]
      description: 'The computer a carried device pairs through (the Carbon''s own pair of it); it must be awake too'
      properties:
        device_id: {$ref: '#/components/schemas/DeviceIdValue'}
        name: {type: string}
        online: {type: boolean}
    WakeCreate:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: 1–300 Unicode scalar values after trimming, at most 1,000 raw; kept exactly as written
    WakeRequest:
      type: object
      required: [wake_id, device_id, team, from, to, reason, created_at, last_asked_at, asks, expires_at, state, wake_detectable, device_notice]
      description: |
        A Silicon's request that its Carbon wake a device (1.1). The Carbon who paired the pair sees every Team's requests
        on it; a Silicon sees its own. Read enum values you don't know as the nearest general case: later versions may
        add some.
      properties:
        wake_id: {type: string, format: uuid}
        device_id: {allOf: [{$ref: '#/components/schemas/DeviceIdValue'}], description: The pair the Silicon asked through}
        team: {type: string, description: The asking Silicon's Team}
        from: {$ref: '#/components/schemas/SiliconId'}
        to: {allOf: [{$ref: '#/components/schemas/CarbonId'}], description: The Carbon who gave the Silicon access (the pair's owner)}
        reason: {type: string, description: 'The latest ask''s reason, exactly as written'}
        created_at: {type: string, format: date-time}
        last_asked_at: {type: string, format: date-time}
        asks: {type: integer, minimum: 1, description: 'Asking again after 5 minutes refreshes the request and counts here'}
        expires_at: {type: string, format: date-time, description: 30 minutes after the last ask}
        state: {type: string, enum: [open, woken, expired, withdrawn, declined]}
        ended_at: {type: string, format: date-time}
        end_reason:
          type: string
          enum: [woken_on_device, confirmed_by_carbon, expired, cancelled, declined, session_started, access_removed, left_team,
            device_removed, muted, rollback]
        wake_detectable: {type: boolean, description: 'Whether Extend can tell when the device wakes; when false, its Carbon answers "It''s awake"'}
        device_notice:
          type: string
          enum: [sent, shown, not_shown, offline, unsupported]
          description: 'What the device did with it. unsupported: a carried device or an app older than 1.1, so Ting is the only way it reaches the Carbon.'
        device_notice_note: {type: string, maxLength: 300, example: Notifications are off for Silicon Extend on this phone.}
        ting:
          type: string
          enum: [pending, deferred, delivered, failed, covered]
          description: 'The Ting to the Carbon. covered: an earlier Ting for the same pair and Team covers it (ting_covered_by). A Silicon sees deferred as pending.'
        ting_covered_by: {type: string, format: uuid}
        ting_last_error: {type: string, description: 'Why the Ting isn''t delivered yet; for a missing app/context type, the owning-Team manager''s register command'}
        answer_ting: {type: string, enum: [pending, deferred, delivered, failed, covered], description: The Ting back to the Silicon once woken or declined}
        answer_ting_last_error: {type: string}
        host: {$ref: '#/components/schemas/HostDevice'}
    WakeAnswer:
      type: object
      additionalProperties: false
      required: [answer]
      properties:
        answer: {type: string, enum: [woken, declined]}
        wake_ids: {type: array, items: {type: string, format: uuid}, description: 'declined only: which requests (all on this pair when absent)'}
    WakeAnswered:
      type: object
      required: [answer, ended]
      properties:
        answer: {type: string, enum: [woken, declined]}
        ended: {type: array, items: {$ref: '#/components/schemas/WakeRequest'}, description: 'The requests on the answering Carbon''s own pair that ended; other Carbons'' are never listed'}
    WakeSettings:
      type: object
      additionalProperties: false
      required: [muted]
      properties:
        muted: {type: boolean}
        silicon_id: {allOf: [{$ref: '#/components/schemas/SiliconId'}], description: 'One Silicon instead of the whole pair'}
        team: {type: string, description: 'With silicon_id: only its grant in this Team (every Team when absent)'}
    WakeSettingsView:
      type: object
      required: [device_id, muted, silicons_muted]
      properties:
        device_id: {$ref: '#/components/schemas/DeviceIdValue'}
        muted: {type: boolean, description: Wake requests are off for the whole pair}
        silicons_muted:
          type: array
          items:
            type: object
            required: [silicon_id, team]
            properties:
              silicon_id: {$ref: '#/components/schemas/SiliconId'}
              team: {type: string}

    TingRegistration:
      type: object
      required: [team, member, status, missing_types]
      description: Whether Extend's Tings reach a member in a Team (1.1)
      properties:
        team: {type: string}
        member: {type: string, example: 'c:alice'}
        status: {type: string, enum: ['on', 'off', pending]}
        registered_at: {type: string, format: date-time}
        refused_at: {type: string, format: date-time}
        last_error: {type: string, example: Sign in to Extend for labs}
        missing_types:
          type: array
          items: {type: string}
          example: [extend.device.wake_requested]
          description: 'Missing app/context types observed during delivery in this Team, by full name; the app-owning Team manager registers them. Recipient Turn on does not clear these observations.'

    TestingEnvironment:
      type: object
      required: [environment_id, name, state]
      properties:
        environment_id: {type: string, format: uuid}
        name: {type: string}
        state: {type: string, enum: [preparing, ready, cleaning, disabled, removed]}
        paired_devices: {type: integer, minimum: 0, maximum: 5}
        device_limit: {type: integer, const: 5}

    HoneycombOperation:
      type: object
      additionalProperties: false
      description: Honeycomb's participant instruction. An unknown field is refused (400).
      required: [operation_id, environment_id, org_id, app_id, environment_revision, generation, key_version, action, testing_key]
      properties:
        operation_id: {type: string, format: uuid}
        environment_id: {type: string, format: uuid}
        org_id: {type: string, minLength: 1, maxLength: 128}
        app_id: {type: string, description: Must be Extend's application id}
        environment_revision: {type: integer, minimum: 1, description: Newer than or equal to the environment's; older is stale (409)}
        generation: {type: integer, minimum: 1, description: Only clean advances it}
        key_version: {type: integer, minimum: 1, description: Only rotate-key advances it}
        action:
          type: string
          enum: [prepare, activate, rotate-key, clean, disable, restore, purge, import, refresh-import, retire-applications]
          description: '`activate` is an Extend extension (Honeycomb confirms readiness to IAM); the import actions concern IAM''s application records and are acknowledged'
        testing_key: {type: string, pattern: '^[A-Za-z0-9]{32}$', writeOnly: true}
        name: {type: [string, 'null'], minLength: 1, maxLength: 128}
        description: {type: [string, 'null']}
        snapshot: {description: 'Accepted with import instructions; Extend keeps nothing from it'}
        reason: {type: [string, 'null']}
        retired_apps:
          type: [array, 'null']
          items: {type: string}
          description: 'With retire-applications: the applications leaving the environment. Naming Extend clears Extend''s data and disables the environment.'
    HoneycombReceipt:
      type: object
      required: [operation_id, environment_id, app_id, environment_revision, generation, key_version, state, target_state, retired_apps, error]
      properties:
        operation_id: {type: string, format: uuid}
        environment_id: {type: string, format: uuid}
        app_id: {type: string}
        environment_revision: {type: integer, minimum: 1}
        generation: {type: integer, minimum: 1}
        key_version: {type: integer, minimum: 1}
        state: {type: string, enum: [pending, completed, failed]}
        target_state:
          type: string
          enum: [preparing, ready, cleaning, disabled, removed]
          description: 'The state the environment is in once the operation completes (see applyHoneycombLifecycle)'
        retired_apps: {type: array, items: {type: string}, description: Echoes the instruction's retired_apps (empty when none)}
        error: {type: [string, 'null'], description: 'When failed: "<code>: <message>"'}
