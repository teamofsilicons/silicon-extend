name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.9-bookworm
        env: {POSTGRES_USER: extend, POSTGRES_PASSWORD: extend, POSTGRES_DB: extend}
        ports: ['5440:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      EXTEND_TEST_ADMIN_URL: 'postgres://extend:extend@127.0.0.1:5440/postgres'
      # The whole workspace with debug info (the desktop agent pulls in GTK and WebKit) fills the
      # runner's disk; tests don't need debug info or incremental state.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Free disk space (preinstalled toolchains this job doesn't use)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL && df -h /
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Consumer-driven contracts (TECHNICAL.md section 10, contracts/README.md): the client crate's
      # recorded fixtures must match what it sends, and a real service must still accept every
      # fixture of every API major it serves (client, device apps, Honeycomb). The workspace step
      # below runs both again; this step names a broken contract on its own.
      - name: Consumer contracts
        run: |
          cargo test --locked -p silicon-extend-client --test contract_fixtures
          cargo test --locked -p extend-service --test contracts
      - run: cargo test --workspace --locked
      - name: CLI end-to-end
        run: |
          cargo build --locked -p silicon-extend-cli -p extend-service --bins --example fake_device
          set -a; . e2e/dev.env; set +a
          ./target/debug/extend-service &
          for _ in $(seq 60); do curl -fsS http://127.0.0.1:8480/ready >/dev/null && break; sleep 1; done
          bash e2e/cli-e2e.sh
  web:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e
  # The agent-device fork and the desktop packaging that stamps and wraps it.
  fork:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@v4
        with: {version: 11.17.0} # vendor/agent-device/package.json packageManager
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm, cache-dependency-path: vendor/agent-device/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
        working-directory: vendor/agent-device
      # Every fork test file an Extend change touched (vendor/agent-device/FORK.md). The fork's full
      # suite has failures that predate Extend, so it is not run here.
      - name: Fork tests Extend changed
        working-directory: vendor/agent-device
        run: >-
          pnpm exec vitest run --project unit-core
          packages/contracts/src/session-surface.test.ts
          packages/platform-apple/src/__tests__/interactor-macos-surface.test.ts
          packages/platform-apple/src/__tests__/interactor-runner-provider.test.ts
          packages/platform-apple/src/__tests__/runner-requests.test.ts
          packages/platform-apple/src/core/__tests__/interactions.test.ts
          packages/platform-apple/src/os/macos/apps.test.ts
          packages/platform-apple/src/os/macos/helper.test.ts
          packages/platform-apple/src/recording/recovery.test.ts
          packages/platform-apple/src/recording/runtime.test.ts
          packages/platform-apple/src/runtime.test.ts
          packages/platform-linux/src/__tests__/clipboard.test.ts
          packages/platform-linux/src/lifecycle.test.ts
          packages/platform-linux/src/recording/runtime.test.ts
          packages/platform-linux/src/runtime.test.ts
          src/daemon/__tests__/macos-text-surface-runner-context.test.ts
          src/daemon/__tests__/screenshot-crop-target.test.ts
          src/daemon/interaction/internal/__tests__/find-macos-frontmost-surface.test.ts
          src/daemon/session-lifecycle/internal/__tests__/session-close-error-precedence.test.ts
          src/daemon/session-lifecycle/internal/__tests__/session-open-surface.test.ts
          src/platform-runtime-screen-recording-host.test.ts
          src/platform-runtime-screen-recording-linux-host.test.ts
          src/platform-runtime-screen-recording-macos-host.test.ts
          src/platform-runtime-screen-recording-process-host.test.ts
      # Built so the packaging tests also check the real dist (they skip that case without one).
      - run: pnpm build
        working-directory: vendor/agent-device
      - name: Desktop runtime entry, runtime stamp and packaging checks
        run: node --test apps/desktop/*.test.mjs
  android:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: apps/android}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      # JVM tests only (the app's 138 and libadb's); the instrumented tests need an emulator.
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :libadb:testDebugUnitTest
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: npx @redocly/cli@2.49.0 lint understanding/api.yaml --skip-rule no-path-trailing-slash
