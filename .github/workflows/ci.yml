name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.9-bookworm
        env: {POSTGRES_USER: extend, POSTGRES_PASSWORD: extend, POSTGRES_DB: extend}
        ports: ['5440:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      EXTEND_TEST_ADMIN_URL: 'postgres://extend:extend@127.0.0.1:5440/postgres'
      # The whole workspace with debug info (the desktop agent pulls in GTK and WebKit) fills the
      # runner's disk; tests don't need debug info or incremental state.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Free disk space (preinstalled toolchains this job doesn't use)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL && df -h /
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev
      - run: cargo fmt --check
      - name: Deployment environment renderer and host helper refresh
        run: python3 -m unittest discover -s deploy/aws -p 'test_*.py'
      # The Silicon Apps packager's refusals and discovery checks (the full pack with the real
      # packer runs in release.yml, which installs silicon-apps).
      - name: Silicon Apps packager
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Consumer-driven contracts (TECHNICAL.md section 10, contracts/README.md): the client crate's
      # recorded fixtures must match what it sends, and a real service must still accept every
      # fixture of every API major it serves (the client and the device apps). The workspace step
      # below runs both again; this step names a broken contract on its own.
      - name: Consumer contracts
        run: |
          cargo test --locked -p silicon-extend-client --test contract_fixtures
          cargo test --locked -p extend-service --test contracts
      - run: cargo test --workspace --locked
      - name: CLI end-to-end
        run: |
          cargo build --locked -p silicon-extend-cli -p extend-service --bins --example fake_device
          set -a; . e2e/dev.env; set +a
          ./target/debug/extend-service &
          for _ in $(seq 60); do curl -fsS http://127.0.0.1:8480/ready >/dev/null && break; sleep 1; done
          bash e2e/cli-e2e.sh
  web:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Desktop banner browser controls
        run: node --test ../apps/desktop/banner-ui.e2e.mjs
      # Real Accounts + native-device browser E2E is the migration/release gate; see web/README.md.
  # The device engine (vendor/extend-engine) and the desktop packaging that stamps and wraps it.
  fork:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@v4
        with: {version: 11.17.0} # vendor/extend-engine/package.json packageManager
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm, cache-dependency-path: vendor/extend-engine/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
        working-directory: vendor/extend-engine
      # The engine's whole unit suite (its `pnpm test:unit`: the unit-core and fuzz-worker projects).
      # Tests of upstream tooling Silicon Extend doesn't ship were removed (vendor/extend-engine/FORK.md),
      # so it passes in full; it needs zip and unzip, which the runner has.
      - name: Engine unit tests
        working-directory: vendor/extend-engine
        run: pnpm test:unit
      # Built so the packaging tests also check the real dist (they skip that case without one).
      - run: pnpm build
        working-directory: vendor/extend-engine
      - name: Desktop runtime entry, runtime stamp and packaging checks
        run: node --test apps/desktop/*.test.mjs
  android:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: apps/android}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      # JVM tests only (the app's 226 and libadb's 10); the instrumented tests need an emulator.
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :libadb:testDebugUnitTest
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: npx @redocly/cli@2.49.0 lint understanding/api.yaml --skip-rule no-path-trailing-slash
      # The Extend 4 review copy (Silicon Accounts, API v2), until a Carbon approves it into understanding/.
      - run: npx @redocly/cli@2.49.0 lint docs/migration/contracts/api.yaml --skip-rule no-path-trailing-slash
