name: Release
# The extend CLI: each of its six targets is built on the runner that built it for Honeycomb before
# (Linux natively on Ubuntu 24.04, so its glibc floor is 2.39), checked where it was built (the
# native format, the glibc ceiling on Linux, and the three discovery commands Silicon Apps runs:
# `extend --help`, `extend accounts --json`, `extend login status --json`, signed out in an empty
# home, wherever the runner can run the binary), then one Linux job packs one Silicon Apps archive
# per target with scripts/package-apps.sh (`silicon-apps validate` + `silicon-apps pack`) and
# uploads them with SHA256SUMS as the workflow artifact `extend-silicon-apps-release`. The desktop
# jobs build and verify the Linux and Windows desktop apps. Nothing is published from here:
# uploading to Silicon Apps, publishing the crates and the GitHub release are separate, reviewed
# steps (docs/deployment.md).
#
# Tags: `cli-v<version>` releases the CLI alone (it must equal crates/extend-cli/Cargo.toml);
# `v<version>` releases the whole product (it must equal the workspace version, the desktop apps'),
# and packs the CLI at its own version too.
on:
  workflow_dispatch:
    inputs:
      cli_only:
        description: Build only the six CLI targets and their Silicon Apps archives; leave desktop releases unchanged
        type: boolean
        default: false
      windows_only:
        description: Only rebuild and verify Windows desktop packages
        type: boolean
        default: false
      desktop_only:
        description: Only rebuild and verify Linux and selected Windows desktop packages
        type: boolean
        default: false
      windows_arch:
        description: Windows architecture for a Windows-only or desktop-only run
        type: choice
        options: [all, x64, arm64]
        default: all
      windows_verification:
        description: ARM64-only manual runs may omit GUI checks blocked by runner privacy setup
        type: choice
        options: [full, terminal-only]
        default: full
  push:
    tags: ['v*', 'cli-v*']
permissions:
  contents: read
env:
  SILICON_APPS_CLI_VERSION: 0.2.0
jobs:
  version:
    name: Read the CLI version and check the tag
    if: ${{ inputs.windows_only != true && inputs.desktop_only != true }}
    runs-on: ubuntu-24.04
    outputs:
      cli: ${{ steps.version.outputs.cli }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check the tag against the CLI and workspace versions
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          workspace = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          cli = tomllib.loads(Path('crates/extend-cli/Cargo.toml').read_text())['package']['version']
          if not isinstance(cli, str):
              raise SystemExit('crates/extend-cli/Cargo.toml must carry its own version (the Silicon Apps release version)')
          if os.environ['REF_TYPE'] == 'tag':
              name = os.environ['REF_NAME']
              expected = f'cli-v{cli}' if name.startswith('cli-v') else f'v{workspace}'
              if name != expected:
                  raise SystemExit(f'::error::The tag {name} must be {expected}: cli-v tags carry the CLI version '
                                   f'({cli}), v tags the workspace (desktop) version ({workspace}).')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'cli={cli}\n')
          print(f'extend CLI {cli} (workspace {workspace})')
          PY
  binaries:
    name: Build extend for ${{ matrix.package }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        # discovery: `require` where the runner runs the binary natively; `auto` where it is
        # cross-built (an ARM64 Windows binary on x64, an Intel Mac binary on Apple silicon without
        # Rosetta), and Silicon Apps' validation worker for that target runs the commands at upload.
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, package: linux-x86_64, binary: extend, discovery: require}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, package: linux-aarch64, binary: extend, discovery: require}
          - {os: windows-2025, target: x86_64-pc-windows-msvc, package: windows-x86_64, binary: extend.exe, discovery: require}
          - {os: windows-2025, target: aarch64-pc-windows-msvc, package: windows-aarch64, binary: extend.exe, discovery: auto}
          - {os: macos-15, target: x86_64-apple-darwin, package: macos-x86_64, binary: extend, discovery: auto}
          - {os: macos-15, target: aarch64-apple-darwin, package: macos-aarch64, binary: extend, discovery: require}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup target add ${{ matrix.target }}
      - name: Check CLI release
        if: matrix.package == 'linux-x86_64'
        run: |
          cargo fmt --check
          cargo clippy --locked -p silicon-extend-cli -p silicon-extend-client --all-targets -- -D warnings
          cargo test --locked -p silicon-extend-cli -p silicon-extend-client --all-targets
      - run: cargo build --locked --release -p silicon-extend-cli --target ${{ matrix.target }}
      - name: Check the binary on the runner that built it
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.cli }}
        run: >-
          bash scripts/package-apps.sh "$VERSION" ${{ matrix.package }}
          target/${{ matrix.target }}/release/${{ matrix.binary }}
          --check-only --discovery ${{ matrix.discovery }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
  package:
    name: Pack the Silicon Apps archives
    needs: [version, binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@v4
        with:
          path: release-binaries
      - name: Install the Silicon Apps packer
        run: cargo install --locked silicon-apps-cli --version "$SILICON_APPS_CLI_VERSION"
      - name: Packager tests (with the real packer)
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate and pack one archive per target
        env:
          VERSION: ${{ needs.version.outputs.cli }}
        run: |
          set -euo pipefail
          for target in linux-x86_64 linux-aarch64 windows-x86_64 windows-aarch64 macos-x86_64 macos-aarch64; do
            binary=extend
            case "$target" in windows-*) binary=extend.exe ;; esac
            scripts/package-apps.sh "$VERSION" "$target" "release-binaries/$target/$binary"
          done
          cd dist/apps
          sha256sum extend-*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          {
            echo "### extend $VERSION Silicon Apps archives"
            echo
            echo "Upload the Linux archives now; macOS and Windows wait until Silicon Apps has their validation workers."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: extend-silicon-apps-release
          path: |
            dist/apps/*.tar.gz
            dist/apps/*.tar.gz.sha256
            dist/apps/SHA256SUMS
          if-no-files-found: error
  # Build and verify Linux/Windows desktop apps: no secrets, nothing published from here.
  desktop-linux:
    if: ${{ inputs.cli_only != true && inputs.windows_only != true && !startsWith(github.ref, 'refs/tags/cli-v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, arch: x64, deb: amd64}
          - {os: ubuntu-24.04-arm, arch: arm64, deb: arm64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev dpkg-dev
      - name: Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: bash apps/desktop/linux/build-package.sh
      - name: Install the package and run it
        run: |
          sudo apt-get install -y ./target/desktop/linux/silicon-extend_*_${{ matrix.deb }}.deb
          extend-agent --version
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: |
            target/desktop/linux/*.tar.gz
            target/desktop/linux/*.deb
          if-no-files-found: error
  desktop-windows:
    if: ${{ inputs.cli_only != true && !startsWith(github.ref, 'refs/tags/cli-v') }}
    env:
      EXTEND_WINDOWS_VERIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_verification || 'full' }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            github.event_name == 'workflow_dispatch' && (inputs.windows_only || inputs.desktop_only) && inputs.windows_arch == 'arm64'
              && '[{"os":"windows-11-arm","arch":"arm64","rustup":"aarch64"}]'
            || github.event_name == 'workflow_dispatch' && (inputs.windows_only || inputs.desktop_only) && inputs.windows_arch == 'x64'
              && '[{"os":"windows-2025","arch":"x64","rustup":"x86_64"}]'
            || '[{"os":"windows-2025","arch":"x64","rustup":"x86_64"},{"os":"windows-11-arm","arch":"arm64","rustup":"aarch64"}]'
          ) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate Windows verification selection
        shell: pwsh
        env:
          WINDOWS_ARCH_SELECTION: ${{ inputs.windows_arch }}
          WINDOWS_ONLY_SELECTION: ${{ inputs.windows_only }}
          DESKTOP_ONLY_SELECTION: ${{ inputs.desktop_only }}
        run: |
          if ($env:EXTEND_WINDOWS_VERIFICATION -eq "terminal-only" -and (
              $env:GITHUB_EVENT_NAME -ne "workflow_dispatch" -or
              $env:RUNNER_ARCH -ne "ARM64" -or
              $env:WINDOWS_ARCH_SELECTION -ne "arm64" -or
              ($env:WINDOWS_ONLY_SELECTION -ne "true" -and $env:DESKTOP_ONLY_SELECTION -ne "true"))) {
            throw "Terminal-only verification requires an explicit ARM64-only manual desktop run."
          }
      - name: Rust
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/${{ matrix.rustup }} -OutFile rustup-init.exe
            .\rustup-init.exe -y --profile minimal --default-toolchain none
            Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"
          }
      - run: pwsh -File apps/desktop/windows/build-zip.ps1
      - name: Run it
        shell: pwsh
        run: |
          & "target/desktop/windows/Silicon Extend/extend-agent.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "extend-agent --version failed" }
      - name: Verify native agent and owned Windows fixtures
        shell: pwsh
        timeout-minutes: 15
        run: ./apps/desktop/windows/verify-native.ps1 -VerificationMode $env:EXTEND_WINDOWS_VERIFICATION
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-verification-${{ matrix.arch }}
          path: target/windows-native-verification/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ matrix.arch }}
          path: target/desktop/windows/*.zip
          if-no-files-found: error
