name: Honeycomb release archive
on:
  workflow_dispatch:
    inputs:
      windows_only:
        description: Only rebuild and verify Windows desktop packages
        type: boolean
        default: false
      desktop_only:
        description: Only rebuild and verify Linux and selected Windows desktop packages
        type: boolean
        default: false
      windows_arch:
        description: Windows architecture for a Windows-only or desktop-only run
        type: choice
        options: [all, x64, arm64]
        default: all
      windows_verification:
        description: ARM64-only manual runs may omit GUI checks blocked by runner privacy setup
        type: choice
        options: [full, terminal-only]
        default: full
  push:
    tags: ['v*', 'cli-v*']
permissions:
  contents: read
jobs:
  binaries:
    if: ${{ inputs.windows_only != true && inputs.desktop_only != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, package: linux-x86_64, binary: extend}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, package: linux-aarch64, binary: extend}
          - {os: windows-2025, target: x86_64-pc-windows-msvc, package: windows-x86_64, binary: extend.exe}
          - {os: windows-2025, target: aarch64-pc-windows-msvc, package: windows-aarch64, binary: extend.exe}
          - {os: macos-15, target: x86_64-apple-darwin, package: macos-x86_64, binary: extend}
          - {os: macos-15, target: aarch64-apple-darwin, package: macos-aarch64, binary: extend}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup target add ${{ matrix.target }}
      - name: Check CLI release
        if: matrix.package == 'linux-x86_64'
        run: |
          cargo fmt --all --check
          cargo clippy --locked -p silicon-extend-cli --all-targets -- -D warnings
          cargo test --locked -p silicon-extend-cli
      - run: cargo build --locked --release -p silicon-extend-cli --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
  pack:
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify release tag
        shell: bash
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          workspace_version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          cli_version = tomllib.loads(Path('crates/extend-cli/Cargo.toml').read_text())['package']['version']
          version = cli_version if isinstance(cli_version, str) else workspace_version
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              prefix = 'cli-v' if os.environ['GITHUB_REF_NAME'].startswith('cli-v') else 'v'
              expected = version if prefix == 'cli-v' else workspace_version
              assert os.environ['GITHUB_REF_NAME'] == f'{prefix}{expected}', 'Release tag and app version differ'
          PY
      - name: Install Honeycomb packager
        run: cargo install silicon-honeycomb-cli --locked --version 0.5.0
      - name: Validate and pack every platform
        run: python3 scripts/package-cli.py --artifacts artifacts --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: extend-honeycomb-release
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
  # Build and verify Linux/Windows desktop apps: no secrets, nothing published from here.
  desktop-linux:
    if: ${{ inputs.windows_only != true && !startsWith(github.ref, 'refs/tags/cli-v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, arch: x64, deb: amd64}
          - {os: ubuntu-24.04-arm, arch: arm64, deb: arm64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev dpkg-dev
      - name: Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: bash apps/desktop/linux/build-package.sh
      - name: Install the package and run it
        run: |
          sudo apt-get install -y ./target/desktop/linux/silicon-extend_*_${{ matrix.deb }}.deb
          extend-agent --version
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: |
            target/desktop/linux/*.tar.gz
            target/desktop/linux/*.deb
          if-no-files-found: error
  desktop-windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/cli-v') }}
    env:
      EXTEND_WINDOWS_VERIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_verification || 'full' }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            github.event_name == 'workflow_dispatch' && (inputs.windows_only || inputs.desktop_only) && inputs.windows_arch == 'arm64'
              && '[{"os":"windows-11-arm","arch":"arm64","rustup":"aarch64"}]'
            || github.event_name == 'workflow_dispatch' && (inputs.windows_only || inputs.desktop_only) && inputs.windows_arch == 'x64'
              && '[{"os":"windows-2025","arch":"x64","rustup":"x86_64"}]'
            || '[{"os":"windows-2025","arch":"x64","rustup":"x86_64"},{"os":"windows-11-arm","arch":"arm64","rustup":"aarch64"}]'
          ) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate Windows verification selection
        shell: pwsh
        env:
          WINDOWS_ARCH_SELECTION: ${{ inputs.windows_arch }}
          WINDOWS_ONLY_SELECTION: ${{ inputs.windows_only }}
          DESKTOP_ONLY_SELECTION: ${{ inputs.desktop_only }}
        run: |
          if ($env:EXTEND_WINDOWS_VERIFICATION -eq "terminal-only" -and (
              $env:GITHUB_EVENT_NAME -ne "workflow_dispatch" -or
              $env:RUNNER_ARCH -ne "ARM64" -or
              $env:WINDOWS_ARCH_SELECTION -ne "arm64" -or
              ($env:WINDOWS_ONLY_SELECTION -ne "true" -and $env:DESKTOP_ONLY_SELECTION -ne "true"))) {
            throw "Terminal-only verification requires an explicit ARM64-only manual desktop run."
          }
      - name: Rust
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/${{ matrix.rustup }} -OutFile rustup-init.exe
            .\rustup-init.exe -y --profile minimal --default-toolchain none
            Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"
          }
      - run: pwsh -File apps/desktop/windows/build-zip.ps1
      - name: Run it
        shell: pwsh
        run: |
          & "target/desktop/windows/Silicon Extend/extend-agent.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "extend-agent --version failed" }
      - name: Verify native agent and owned Windows fixtures
        shell: pwsh
        timeout-minutes: 15
        run: ./apps/desktop/windows/verify-native.ps1 -VerificationMode $env:EXTEND_WINDOWS_VERIFICATION
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-verification-${{ matrix.arch }}
          path: target/windows-native-verification/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ matrix.arch }}
          path: target/desktop/windows/*.zip
          if-no-files-found: error
